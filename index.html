        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; background-color: #f8fafc; }
        .packed-text { text-decoration: line-through; color: #9ca3af; }
        .item-row { transition: background-color 0.2s ease; }
        .item-row:hover { background-color: #f9fafb; }
        
        .avatar-container { position: relative; display: inline-block; cursor: pointer; transition: transform 0.2s; }
        .avatar-container:hover { transform: scale(1.05); }
        .avatar-img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid #4f46e5; background-color: #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .avatar-edit-btn { position: absolute; bottom: 0; right: 0; background-color: #4f46e5; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; }
        
        .doc-card, .menu-card { transition: all 0.2s ease; cursor: pointer; }
        .doc-card:active, .menu-card:active { transform: scale(0.97); }
        
        .check-toggle { transition: all 0.3s; cursor: pointer; }
        .check-toggle.active { background-color: #10b981; border-color: #10b981; color: white; }
        
        .glass-header { background: rgba(79, 70, 229, 0.95); backdrop-filter: blur(10px); }
        
        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .anim-pulse { animation: pulse-soft 2s infinite; }
        
        @keyframes alert-flash { 0%, 100% { background-color: rgba(220, 38, 38, 0.95); } 50% { background-color: rgba(185, 28, 28, 1); transform: scale(1.02); } }
        .sos-flashing { animation: alert-flash 1.5s infinite; }

        .playing-card { background: white; border-radius: 8px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 80px; height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 800; font-size: 2.5rem; position: relative; }
        .playing-card .suit-top { position: absolute; top: 5px; left: 5px; font-size: 1.2rem; line-height: 1; }
        .playing-card .suit-bottom { position: absolute; bottom: 5px; right: 5px; font-size: 1.2rem; line-height: 1; transform: rotate(180deg); }
        .card-red { color: #ef4444; }
        .card-black { color: #1f2937; }

            { q: "איזה חג מכונה 'זמן חירותנו'?", o: ["סוכות", "שבועות", "פסח", "חנוכה"], a: 2 },
            { q: "מהו הנהר הארוך בעולם?", o: ["האמזונס", "הנילוס", "הירדן", "הדנובה"], a: 1 },
            { q: "מי היה ראש הממשלה הראשון של ישראל?", o: ["יצחק רבין", "דוד בן גוריון", "מנחם בגין", "גולדה מאיר"], a: 1 },
            { q: "כמה שחקנים יש בקבוצת כדורסל על המגרש?", o: ["11", "5", "7", "6"], a: 1 },
            { q: "איך קוראים לסירה של ונציה?", o: ["קיאק", "קאנו", "גונדולה", "מעבורת"], a: 2 },
            { q: "איזו חיה מכינה דבש?", o: ["צרעה", "זבוב", "נמלה", "דבורה"], a: 3 },
            { q: "באיזו יבשת נמצאת אוסטריה?", o: ["אסיה", "אירופה", "אמריקה", "אפריקה"], a: 1 },
            { q: "מהו ההר הגבוה בעולם?", o: ["החרמון", "האלפים", "האברסט", "הקילימנג'רו"], a: 2 },
            { q: "איזה סוג של עץ נותן אצטרובלים?", o: ["אלון", "ברוש", "אורן", "זית"], a: 2 }
        ];

        function getMyIdentity() {
            let name = localStorage.getItem('tiyul_my_identity');
            if (!name) {
                name = prompt("כדי לאפשר זיהוי במשחקים, מכ\"ם ומצוקה - מי אתה מבין חברי המשפחה?");
                if (name) localStorage.setItem('tiyul_my_identity', name.trim());
            }
            return name || "משתמש אנונימי";
        }

        db.ref('/').on('value', (snapshot) => {
            try {
                const data = snapshot.val();
                if (data) {
                    appData = { ...appData, ...data };
                    // הבטחת מבני נתונים
                    if (!appData.wallet) appData.wallet = { expenses: {}, planned: {} };
                    if (!appData.wallet.planned) appData.wallet.planned = {};
                    if (!appData.wallet.expenses) appData.wallet.expenses = {};
                    if (!appData.games) appData.games = { scores: { mishmar: 0, adora: 0 }, individualScores: {}, currentCountryCity: { letter: "?" }, liveSong: { word: "?" }, photoHunt: { mission: "לחצו להגרלת משימה ראשונה!" }, war: { players: {} } };
                    if (!appData.emergencyContacts) appData.emergencyContacts = { custom: {} };
                    if (!appData.emergency) appData.emergency = { sos: null, liveLocations: {}, ping: 0 };
                    
                    // בדיקת קריאת מצוקה פתוחה (SOS)
                    const sos = appData.emergency.sos;
                    if (sos && sos.active) {
                        const myName = localStorage.getItem('tiyul_my_identity');
                        if (sos.timestamp > lastSosTimestamp && sos.sender !== myName) {
                            document.getElementById('sos-alert-modal').classList.remove('hidden');
                            document.getElementById('sos-sender-name').innerText = `מאת: ${sos.sender}`;
                            document.getElementById('sos-nav-link').href = `https://www.google.com/maps/search/?api=1&query=${sos.lat},${sos.lng}`;
                            lastSosTimestamp = sos.timestamp;
                        }
                    } else {
                        document.getElementById('sos-alert-modal').classList.add('hidden');
                    }

                    // בדיקת בקשת Ping למיקום
                    const pingTime = appData.emergency.ping || 0;
                    const lastHandledPing = Number(localStorage.getItem('last_ping_handled')) || 0;
                    if (pingTime > lastHandledPing && (Date.now() - pingTime) < 30000) {
                        const myIdentity = localStorage.getItem('tiyul_my_identity');
                        if (myIdentity && navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition((pos) => {
                                db.ref(`emergency/liveLocations/${myIdentity}`).set({
                                    lat: pos.coords.latitude,
                                    lng: pos.coords.longitude,
                                    timestamp: firebase.database.ServerValue.TIMESTAMP
                                });
                            }, ()=>{}, { enableHighAccuracy: true });
                        }
                        localStorage.setItem('last_ping_handled', pingTime);
                    }
                }
                
                generateInitialData();
                document.getElementById('sync-status').innerHTML = '<i class="fas fa-cloud-check text-green-300 mr-1"></i> מחובר';
                
                // עדכון נקודות עליון
                document.getElementById('pts-m').innerText = appData.games.scores.mishmar || 0;
                document.getElementById('pts-a').innerText = appData.games.scores.adora || 0;

                renderApp();
            } catch (err) {
                document.getElementById('loading-text').innerText = "שגיאה במסד הנתונים: " + err.message;
                console.error(err);
            }
        }, (err) => {
            document.getElementById('sync-status').innerHTML = '<i class="fas fa-exclamation-triangle text-red-300 mr-1"></i> אין רשת';
            document.getElementById('loading-text').innerText = "אין קליטה. בדוק חיבור לאינטרנט.";
        });

        function triggerSOS() {
            const myName = getMyIdentity();
            if (!myName || myName === "משתמש אנונימי") return;

            if (navigator.geolocation) {
                showModal('משדר מצוקה...', '<i class="fas fa-satellite-dish fa-spin text-3xl text-red-500 mb-2"></i><br>מאתר את המיקום המדויק שלך ומשדר למשפחה...', false);
                navigator.geolocation.getCurrentPosition((pos) => {
                    db.ref('emergency/sos').set({
                        active: true, sender: myName, lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        showModal('המצוקה שודרה!', 'כל המשפחה קיבלה עכשיו התראה עם המיקום שלך. הישאר במקום ואל תזוז!', false, () => {
                            setTimeout(() => { showModal('ביטול אזעקה', 'האם תרצה לכבות את התראת המצוקה?', true, cancelSOS); }, 500);
                        });
                    });
                }, (err) => { showModal('שגיאת GPS', 'לא הצלחנו למצוא מיקום. ודא שה-GPS דלוק במכשיר!'); }, { enableHighAccuracy: true, timeout: 10000 });
            } else { showModal('שגיאה', 'המכשיר לא תומך באיתור מיקום.'); }
        }

        function cancelSOS() {
            db.ref('emergency/sos/active').set(false);
            document.getElementById('sos-alert-modal').classList.add('hidden');
        }

        function pingEveryone() {
            showModal('מפעיל מכ"ם...', 'שולח פקודה לכל המכשירים הפתוחים של המשפחה לשדר את המיקום שלהם...', false);
            db.ref('emergency/ping').set(firebase.database.ServerValue.TIMESTAMP).then(() => { setTimeout(() => { document.getElementById('custom-modal').classList.add('hidden'); }, 2000); });
        }

        function updateMyLiveLocation() {
            const myName = getMyIdentity();
            if (!myName || myName === "משתמש אנונימי") return;
            if (navigator.geolocation) {
                showModal('מעדכן מיקום...', 'מחפש לוויינים...', false);
                navigator.geolocation.getCurrentPosition((pos) => {
                    db.ref(`emergency/liveLocations/${myName}`).set({
                        lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => { document.getElementById('custom-modal').classList.add('hidden'); });
                }, () => { showModal('שגיאה', 'לא ניתן לקרוא מיקום.'); }, { enableHighAccuracy: true });
            }
        }

        function showModal(title, message, showCancel = false, onOk = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            const modal = document.getElementById('custom-modal');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            const okBtn = document.getElementById('modal-ok-btn');
            cancelBtn.style.display = showCancel ? 'block' : 'none';
            const newOkBtn = okBtn.cloneNode(true); okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            const newCancelBtn = cancelBtn.cloneNode(true); cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('modal-content-box').classList.remove('scale-95'); }, 10);
            const close = () => { modal.classList.add('opacity-0'); document.getElementById('modal-content-box').classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); };
            newOkBtn.onclick = () => { close(); if (onOk) onOk(); };
            newCancelBtn.onclick = close;
        }

        function navigate(view, group = null) {
            currentView = view; currentGame = null;
            if (group) { currentGroup = group; currentTab = families[group].members[0]; }
            renderApp();
        }

        function renderApp() {
            const content = document.getElementById('app-content');
            const tabsContainer = document.getElementById('tabs-container');
            const homeBtn = document.getElementById('home-btn');
            const progressContainer = document.getElementById('progress-container');
            const totalPoints = document.getElementById('total-points-display');

            document.getElementById('loading-spinner').classList.add('hidden');

            if (currentView === 'dashboard') {
                homeBtn.classList.add('hidden'); tabsContainer.classList.add('hidden'); progressContainer.classList.add('hidden'); totalPoints.classList.add('hidden');
                renderDashboard(content);
            } else if (currentView === 'games_console') {
                homeBtn.classList.remove('hidden'); tabsContainer.classList.add('hidden'); progressContainer.classList.add('hidden'); totalPoints.classList.remove('hidden');
                if(!currentGame) renderGamesMenu(content);
                else if(currentGame === 'trivia') renderTrivia(content);
                else if(currentGame === 'country_city') renderCountryCity(content);
                else if(currentGame === 'songs') renderLiveSong(content);
                else if(currentGame === 'photo_hunt') renderPhotoHunt(content);
                else if(currentGame === 'war') renderCardWar(content);
            } else {
                homeBtn.classList.remove('hidden'); totalPoints.classList.add('hidden');
                if (['mishmar', 'adora', 'shared'].includes(currentView)) {
                    tabsContainer.classList.remove('hidden'); progressContainer.classList.remove('hidden');
                    renderTabs(); renderContent(); updateGroupProgress();
                } else {
                    tabsContainer.classList.add('hidden'); progressContainer.classList.add('hidden');
                    if (currentView === 'caravan') renderCaravan();
                    else if (currentView === 'wallet') renderWallet();
                    else if (currentView === 'map') renderMap();
                    else if (currentView === 'emergency') renderEmergency();
                    else if (currentView === 'chores') renderChores();
                }
            }
            window.scrollTo(0,0);
        }

            content.innerHTML = `

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            if(!currentGroup) return;
            families[currentGroup].members.forEach(person => {
                const isActive = person === currentTab;
                let total = 0, packed = 0;
                if(appData.items[person]) { Object.values(appData.items[person]).forEach(item => { total++; if(item.packed) packed++; }); }
                const isDone = (packed === total && total > 0);
                const progressText = total > 0 ? `${packed}/${total}` : '';
                const btn = document.createElement('button');
                btn.className = `px-5 py-3 whitespace-nowrap text-sm flex-shrink-0 transition-colors border-b-[3px] ${isActive ? 'border-indigo-600 text-indigo-700 font-extrabold bg-indigo-50/50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`;
                btn.innerHTML = `<div class="flex flex-col items-center gap-1"><span class="text-base">${person}</span>${total > 0 ? `<span class="text-[10px] bg-white border border-gray-200 px-2 py-0.5 rounded-full shadow-sm ${isDone ? 'text-green-600 font-bold' : 'text-gray-500'}">${isDone ? '<i class="fas fa-check mr-1"></i>' : ''}${progressText}</span>` : ''}</div>`;
                btn.onclick = () => { currentTab = person; renderApp(); };
                container.appendChild(btn);
            });
        }

        function renderContent() {
            const content = document.getElementById('app-content');
            const personItems = appData.items[currentTab] || {};
            const personDocs = appData.documents[currentTab] || {};
            
            let html = `
                <div class="flex justify-center mb-2 mt-4">
                    <div class="avatar-container" onclick="document.getElementById('avatar-upload').click()">
                        <img id="current-avatar" class="avatar-img" src="${appData.avatars[currentTab] || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentTab.split(' ')[0])}&background=e0e7ff&color=4f46e5&size=150`}">
                        <div class="avatar-edit-btn"><i class="fas fa-camera"></i></div>
                    </div>
                </div>
                <div class="text-center mb-6"><h2 class="text-3xl font-extrabold text-gray-800">${currentTab}</h2></div>
            `;

            const requiredDocs = getRequiredDocsForTab(currentTab);
            html += `
            <div class="bg-white rounded-3xl shadow-sm border border-gray-200 mb-8 overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                    <h3 class="font-bold text-lg text-gray-800"><i class="fas fa-folder-open mr-2 text-indigo-500"></i> מסמכים דיגיטליים</h3>
                </div>
                <div class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-3">`;
            
            requiredDocs.forEach(doc => { const hasDoc = !!personDocs[doc.id]; html += renderDocCard(doc.id, doc.name, doc.icon, hasDoc); });
            Object.keys(personDocs).forEach(docId => { if(!requiredDocs.find(d => d.id === docId)) { html += renderDocCard(docId, docId, 'fa-file-alt', true); } });

            html += `

                    <div class="text-2xl mb-1 text-indigo-400"><i class="fas fa-plus-circle"></i></div>

                </div>

            const grouped = {};

                const item = personItems[key];

                grouped[item.category].push({ id: key, ...item });

                html += `<div class="text-center p-8 bg-white rounded-3xl shadow-sm border"><p class="text-gray-500">הרשימה ריקה.</p></div>`;

                        <span class="text-xs font-bold bg-white px-3 py-1.5 rounded-full shadow-sm border ${isCatDone ? 'border-green-200 text-green-700' : 'border-gray-200'}">${catPacked}/${catTotal}</span>

                items.forEach(item => {
                    html += `
                    <li class="item-row p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center ${item.packed ? 'bg-gray-50/50' : ''} gap-4 sm:gap-0">

                            </div>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto justify-end border-t sm:border-0 pt-3 sm:pt-0 border-gray-100">
                            <button onclick="editExistingItem('${currentTab}', '${item.id}', '${item.name.replace(/'/g, "\\'")}', '${item.amount}', '${(item.note||'').replace(/'/g, "\\'")}')" class="text-blue-500 bg-blue-50 hover:bg-blue-100 px-4 py-2.5 rounded-xl transition font-medium"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteItem('${currentTab}', '${item.id}')" class="text-red-500 bg-red-50 hover:bg-red-100 px-4 py-2.5 rounded-xl transition font-medium"><i class="fas fa-trash"></i></button>
                        </div>
                    </li>`;
                });
                html += `
                    <li class="p-4 bg-gray-50/50">
                        <div class="flex flex-col gap-3">
                            <input type="text" id="new-name-${category}" placeholder="שם פריט" class="w-full p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-400 bg-white">

            const file = event.target.files[0]; if (!file) return; showModal('מעלה תמונה...', 'מכווץ ושולח לכולם...', false);
            const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
            if (width > height) { if (width > 800) { height *= 800 / width; width = 800; } } else { if (height > 800) { width *= 800 / height; height = 800; } }
            canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height); db.ref(`games/photoHunt/lastUpload`).set(canvas.toDataURL('image/jpeg', 0.6)).then(() => document.getElementById('custom-modal').classList.add('hidden')); }; img.src = e.target.result; }; reader.readAsDataURL(file); event.target.value = ''; 
        }

        // --- שירון ---
        function renderLiveSong(content) {
            const data = appData.games.liveSong;
            let html = `<div class="mb-4"><button onclick="navigate('games_console')" class="text-gray-500 font-bold hover:text-gray-800"><i class="fas fa-arrow-right mr-1"></i> חזור לתפריט</button></div><div class="text-center mb-8"><div class="w-20 h-20 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-music"></i></div><h2 class="text-4xl font-extrabold text-gray-800">שירון קרוואנים</h2></div>`;
            html += `<div class="bg-white rounded-3xl p-8 shadow-xl text-center border-t-8 border-purple-600 mb-8"><p class="text-purple-500 font-black mb-2 uppercase tracking-widest text-sm">המילה להגרלה:</p><h3 class="text-6xl font-black text-gray-800 mb-8">${data.word}</h3><button onclick="spinSongWord()" class="w-full bg-gradient-to-r from-purple-500 to-fuchsia-600 text-white font-black text-2xl py-4 rounded-2xl shadow-lg hover:opacity-90 transition"><i class="fas fa-sync-alt mr-2"></i> הגרל מילה חדשה לכולם</button></div>`;
            html += `<div class="bg-purple-50 rounded-3xl p-6 border border-purple-100"><h4 class="font-extrabold text-purple-800 mb-4 text-xl">מיצאו שיר והקלידו מהר!</h4><div class="flex gap-2"><input type="text" id="song-answer" placeholder="הקלד את השיר שמצאת..." class="flex-1 p-4 border border-purple-200 rounded-xl font-bold outline-none text-lg"><button onclick="submitSongAnswer()" class="bg-gray-800 text-white px-6 rounded-xl font-bold hover:bg-black transition text-lg">שלח!</button></div>`;
            if(data.lastAnswer) html += `<div class="mt-6 text-center bg-white p-4 rounded-2xl shadow-sm border border-purple-200"><p class="text-sm text-gray-500 font-bold mb-1">תשובה אחרונה שהוזנה:</p><p class="text-2xl font-black text-purple-700">${data.lastAnswer}</p></div>`;
            html += `</div>`; content.innerHTML = html;
        }
        function spinSongWord() { db.ref('games/liveSong/word').set(songWords[Math.floor(Math.random() * songWords.length)]); db.ref('games/liveSong/lastAnswer').set(null); }
        function submitSongAnswer() { const a = document.getElementById('song-answer').value.trim(); if(a) db.ref('games/liveSong/lastAnswer').set(a); }

        // --- טריוויה ---
        function renderTrivia(content) {
            let html = `<div class="mb-4"><button onclick="navigate('games_console')" class="text-gray-500 font-bold hover:text-gray-800"><i class="fas fa-arrow-right mr-1"></i> חזור לתפריט</button></div><div class="text-center mb-8"><div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-brain"></i></div><h2 class="text-4xl font-extrabold text-gray-800">מגה-טריוויה</h2></div>`;
            html += `<div id="trivia-container" class="bg-white rounded-3xl p-8 shadow-xl text-center border-t-8 border-blue-600"><button onclick="startTrivia()" class="bg-blue-600 text-white font-black text-2xl px-10 py-5 rounded-2xl shadow-lg hover:bg-blue-700 transition w-full">שלוף שאלה!</button></div>`;
            content.innerHTML = html;
        }
        function startTrivia() {
            const q = triviaQuestions[Math.floor(Math.random() * triviaQuestions.length)];
            let html = `<h3 class="text-2xl font-black text-gray-800 mb-8 leading-tight">${q.q}</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
            q.o.forEach((opt, idx) => { html += `<button onclick="answerTrivia(${idx}, ${q.a})" class="bg-gray-50 border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 text-gray-700 font-bold text-xl py-4 rounded-2xl transition">${opt}</button>`; });
            html += `</div>`; document.getElementById('trivia-container').innerHTML = html;
        }
        function answerTrivia(selected, correct) {
            if(selected === correct) { document.getElementById('trivia-container').innerHTML = `<div class="text-green-500 text-6xl mb-4"><i class="fas fa-check-circle"></i></div><h3 class="text-3xl font-black text-gray-800 mb-6">תשובה נכונה!</h3><p class="text-gray-500 font-bold mb-6">הענקו לעצמכם נקודות בראש המסך!</p><button onclick="startTrivia()" class="bg-blue-600 text-white font-bold text-xl px-8 py-4 rounded-xl shadow-md w-full">שאלה הבאה</button>`; } 
            else { document.getElementById('trivia-container').innerHTML = `<div class="text-red-500 text-6xl mb-4"><i class="fas fa-times-circle"></i></div><h3 class="text-3xl font-black text-gray-800 mb-6">טעות!</h3><button onclick="startTrivia()" class="bg-gray-800 text-white font-bold text-xl px-8 py-4 rounded-xl shadow-md w-full">שאלה הבאה</button>`; }
        }

        // --- ארץ עיר חכם ---
        function renderCountryCity(content) {
            const data = appData.games.currentCountryCity;
            let html = `<div class="mb-4"><button onclick="navigate('games_console')" class="text-gray-500 font-bold hover:text-gray-800"><i class="fas fa-arrow-right mr-1"></i> חזור לתפריט</button></div><div class="text-center mb-8"><div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-globe-americas"></i></div><h2 class="text-4xl font-extrabold text-gray-800">ארץ עיר חכם</h2></div>`;
            html += `<div class="bg-white rounded-3xl p-8 shadow-xl text-center border-t-8 border-green-500 mb-8"><p class="text-green-600 font-black mb-2 uppercase tracking-widest text-sm">האות הנוכחית לכולם:</p><h3 class="text-7xl font-black text-gray-800 mb-8">${data.letter}</h3><button onclick="spinLetter()" class="w-full bg-green-500 text-white font-black text-2xl py-4 rounded-2xl shadow-lg hover:bg-green-600 transition"><i class="fas fa-dice mr-2"></i> הגרל אות חדשה</button></div>`;
            
            const cats = [ {id:'c_country', name:'ארץ'}, {id:'c_city', name:'עיר'}, {id:'c_animal', name:'חי'}, {id:'c_plant', name:'צומח'}, {id:'c_object', name:'דומם'}, {id:'c_boy', name:'ילד'}, {id:'c_girl', name:'ילדה'}, {id:'c_prof', name:'מקצוע'}, {id:'c_color', name:'צבע'} ];
            html += `<div class="bg-gray-50 rounded-3xl p-6 border border-gray-200"><h4 class="font-extrabold text-gray-700 mb-6 text-xl text-center">מלאו מהר ולחצו על "שופט אוטומטי"!</h4><div class="flex flex-col gap-4">`;
            cats.forEach(c => { html += `<div class="flex items-center"><span class="w-24 font-bold text-gray-600 text-lg">${c.name}:</span><input type="text" id="${c.id}" class="flex-1 p-3 border border-gray-300 rounded-xl font-bold text-lg outline-none focus:ring-2 focus:ring-green-400"></div>`; });
            html += `<button onclick="checkCountryCity('${data.letter}')" class="w-full mt-6 bg-gray-800 text-white font-black text-xl py-4 rounded-2xl shadow-lg hover:bg-black transition">שופט אוטומטי - בדוק תוצאות!</button><div id="cc-results" class="mt-6 text-center"></div></div></div>`;
            content.innerHTML = html;
        }
        function spinLetter() { const letters = "אבגדהוזחטיכלמנסעפצקרשת"; db.ref('games/currentCountryCity/letter').set(letters.charAt(Math.floor(Math.random() * letters.length))); }
        function checkCountryCity(letter) {
            if(letter === "?") return showModal('שגיאה', 'יש להגריל אות קודם!');
            const vals = { country: document.getElementById('c_country').value.trim(), color: document.getElementById('c_color').value.trim(), animal: document.getElementById('c_animal').value.trim(), object: document.getElementById('c_object').value.trim(), prof: document.getElementById('c_prof').value.trim() };
            let score = 0; let msgs = [];
            
            const checkDict = (val, dict, name) => {
                if(!val) return;
                if(val.charAt(0) !== letter) { msgs.push(`❌ ${name}: '${val}' לא מתחיל ב-'${letter}'`); return; }
                if(dict.includes(val)) { score += 10; msgs.push(`✅ ${name}: מושלם! (10 נק')`); } 
                else { msgs.push(`❌ ${name}: '${val}' לא נמצא במילון.`); }
            };

            checkDict(vals.country, dictCountries, "ארץ"); checkDict(vals.color, dictColors, "צבע"); checkDict(vals.animal, dictAnimals, "חי"); checkDict(vals.prof, dictProfessions, "מקצוע");
            if(vals.object) { if(vals.object.charAt(0) !== letter) msgs.push(`❌ דומם: לא מתחיל ב-'${letter}'`); else if(letter === 'ר' && !dictObjectsR.includes(vals.object)) msgs.push(`❌ דומם: לא במילון.`); else { score+=10; msgs.push(`✅ דומם: אושר (10 נק')`); } }
            
            document.getElementById('cc-results').innerHTML = `<h3 class="text-3xl font-black text-green-600 mb-4">סך הכל: ${score} נקודות!</h3><div class="text-right text-gray-600 font-bold space-y-2 bg-white p-4 rounded-xl border">${msgs.join('<br>')}</div><p class="mt-4 text-sm font-bold text-red-500">* שאר הקטגוריות הפתוחות (ילד/ילדה/עיר/צומח) יבדקו על ידי שאר המשפחה בקרוואן!</p>`;
        }

        // --- הזרקת נתונים ראשונית (הפונקציה המתוקנת ללא השגיאה!) ---
        function generateInitialData() {
            if (!appData.chores || Object.keys(appData.chores || {}).length === 0) {
                db.ref('chores').set([{ name: "שטיפת כלים", assignee: "" }, { name: "ריקון שירותים כימיים", assignee: "" }, { name: "הכנת קפה", assignee: "" }]);
            }
            if (!appData.checklists || Object.keys(appData.checklists.departure || {}).length === 0) {
                db.ref('checklists/departure').set([{ task: "ניתוק חשמל וגלגול כבל", done: false }, { task: "ריקון מים אפורים", done: false }, { task: "סגירת גז וחלונות", done: false }, { task: "קיפול מדרגה חיצונית", done: false }]);
                db.ref('checklists/arrival').set([{ task: "ייצוב הקרוואן (צ'וקים)", done: false }, { task: "חיבור לחשמל", done: false }, { task: "פתיחת גז לבישול", done: false }]);
            }

            allPeople.forEach(person => {
                if (!appData.items[person] || Object.keys(appData.items[person]).length === 0) {
                    let itemsArray = [];
                    if (!person.startsWith("ציוד כללי") && !person.startsWith("ציוד משמר") && !person.startsWith("ציוד אדורה")) {
                        itemsArray = [
                            { category: "ביגוד יומיום", name: "חולצות קצרות", amount: "8", note: "יש מכונת כביסה" }, 
                            { category: "ביגוד יומיום", name: "מכנסיים", amount: "5", note: "" }, 
                            { category: "ביגוד יומיום", name: "לבנים", amount: "10", note: "" }, 
                            { category: "ביגוד חורף", name: "מעיל פליז", amount: "1", note: "לאוסטריה" }, 
                            { category: "הנעלה", name: "נעלי הליכה סגורות", amount: "1", note: "" }, 
                            { category: "בריכה וים", name: "בגדי ים", amount: "2", note: "" }, 
                            { category: "היגיינה", name: "תיק רחצה אישי", amount: "1", note: "" }
                        ];
                        if (["עוזיאל", "דביר", "אליה", "יוני", "ליאור", "אייל"].includes(person)) { 
                            itemsArray.push({ category: "דת ורוח", name: "תפילין", amount: "1", note: "" }, { category: "דת ורוח", name: "כיפות וציצית", amount: "3", note: "" }); 
                        }
                        if (["עוזיאל", "יוני"].includes(person)) { 
                            itemsArray.push({ category: "דת ורוח", name: "טלית", amount: "1", note: "לשבתות" }); 
                        }
                        if (person === "הילה" || person === "להבה") { 
                            itemsArray.push({ category: "ביגוד יומיום", name: "גוזיות", amount: "5", note: "" }); 
                        }
                        if (person === "יובל" || person === "הלל") { 
                            itemsArray.push({ category: "ציוד תינוקות", name: "חיתולים", amount: "1", note: "" }, { category: "ציוד תינוקות", name: "מנשא", amount: "1", note: "" }); 
                        }
                    } else if (person.startsWith("ציוד כללי פרידמן") || person.startsWith("ציוד משמר") || person.startsWith("ציוד אדורה")) {
                        itemsArray = [ 
                            { category: "לינה בקרוואן", name: "סדינים וכריות", amount: "6 סטים", note: "" }, 
                            { category: "לינה בקרוואן", name: "שמיכות", amount: "6", note: "קר בלילות!" }, 
                            { category: "שבת וכשרות", name: "פלטת שבת", amount: "1", note: "לבדוק מתח" }, 
                            { category: "שבת וכשרות", name: "מיחם", amount: "1", note: "" }, 
                            { category: "שבת וכשרות", name: "נרונים וקידוש", amount: "1 ערכה", note: "" } 
                        ];
                    } else if (person === "ציוד כללי משותף") {
                        itemsArray = [ 
                            { category: "פנאי", name: "אליאס ומשחקים", amount: "1", note: "" }, 
                            { category: "אוכל משותף", name: "פקל קפה", amount: "1", note: "" }, 
                            { category: "חשמל", name: "מתאמים לאירופה", amount: "4", note: "" } 
                        ];
                    }

                    if(itemsArray.length > 0) {
                        const personItemsObj = {}; 
                        itemsArray.forEach((item, index) => { 
                            personItemsObj[`item_${Date.now()}_${index}`] = { ...item, packed: false }; 
                        });
                        db.ref(`items/${person}`).set(personItemsObj);
                    }
                }
            });
        }
    </script>
