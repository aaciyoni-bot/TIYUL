        function renderPhotoHunt(content) { const data = appData.games.photoHunt; let html = `<div class="text-center mb-8"><div class="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-camera"></i></div><h2 class="text-4xl font-extrabold text-gray-800">ציידי התמונות Live!</h2></div><div class="bg-white rounded-3xl p-8 shadow-xl text-center border-t-8 border-orange-500 mb-8"><p class="text-orange-500 font-black mb-2 text-sm">המשימה הנוכחית:</p><h3 class="text-3xl font-black text-gray-800 mb-8">${data.mission}</h3><button onclick="document.getElementById('photo-hunt-upload').click()" class="w-full bg-gradient-to-r from-orange-400 to-amber-500 text-white font-black text-2xl py-5 rounded-2xl shadow-lg transition transform hover:-translate-y-1"><i class="fas fa-camera-retro mr-2"></i> יש לי את זה! צלם עכשיו</button></div><button onclick="spinPhotoMission()" class="w-full bg-gray-800 text-white font-black text-xl py-4 rounded-2xl shadow-md transition mb-8"><i class="fas fa-random mr-2"></i> משימה חדשה לכולם</button>`; if(data.lastUpload) { html += `<div class="bg-white rounded-3xl p-6 shadow-sm text-center"><h4 class="font-extrabold text-gray-700 mb-4 text-xl">תמונה אחרונה שעלתה:</h4><img src="${data.lastUpload}" class="max-w-full rounded-2xl mx-auto max-h-64 object-cover"></div>`; } content.innerHTML = html; }
        function spinPhotoMission() { const m = photoMissions[Math.floor(Math.random() * photoMissions.length)]; dref('games/photoHunt/mission').set(m); dref('games/photoHunt/lastUpload').set(null); }
        function handlePhotoHuntUpload(event) { const file = event.target.files[0]; if (!file) return; showModal('מעלה...', 'שולח לכולם...', false); const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { const canvas = document.createElement('canvas'); let width = img.width, height = img.height; if (width > height) { if (width > 800) { height *= 800 / width; width = 800; } } else { if (height > 800) { width *= 800 / height; height = 800; } } canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height); dref(`games/photoHunt/lastUpload`).set(canvas.toDataURL('image/jpeg', 0.6)).then(() => { const modal = document.getElementById('custom-modal'); if (modal) modal.style.display = 'none'; }); }; img.src = e.target.result; }; reader.readAsDataURL(file); const uploadInput = document.getElementById('photo-hunt-upload'); if(uploadInput) uploadInput.value = ''; }

        function renderLiveSong(content) { const data = appData.games.liveSong; let html = `<div class="text-center mb-8"><div class="w-20 h-20 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-music"></i></div><h2 class="text-4xl font-extrabold text-gray-800">שירון קרוואנים</h2></div><div class="bg-white rounded-3xl p-8 shadow-xl text-center border-t-8 border-purple-600 mb-8"><p class="text-purple-500 font-black mb-2 uppercase tracking-widest text-sm">המילה להגרלה:</p><h3 class="text-6xl font-black text-gray-800 mb-8">${data.word}</h3><button onclick="spinSongWord()" class="w-full bg-gradient-to-r from-purple-500 to-fuchsia-600 text-white font-black text-2xl py-4 rounded-2xl shadow-lg hover:opacity-90 transition"><i class="fas fa-sync-alt mr-2"></i> הגרל מילה חדשה לכולם</button></div><div class="bg-purple-50 rounded-3xl p-6 border border-purple-100"><h4 class="font-extrabold text-purple-800 mb-4 text-xl">הקלידו תשובה:</h4><div class="flex gap-2"><input type="text" id="song-answer" placeholder="איזה שיר מצאתם?" class="flex-1 p-4 border border-purple-200 rounded-xl font-bold outline-none text-lg"><button onclick="submitSongAnswer()" class="bg-gray-800 text-white px-6 rounded-xl font-bold hover:bg-black transition text-lg">שלח!</button></div>`; if(data.lastAnswer) { html += `<div class="mt-6 text-center bg-white p-4 rounded-2xl shadow-sm border border-purple-200"><p class="text-sm text-gray-500 font-bold mb-1">תשובה אחרונה:</p><p class="text-2xl font-black text-purple-700">${data.lastAnswer}</p></div>`; } html += `</div>`; content.innerHTML = html; }
        function spinSongWord() { dref('games/liveSong/word').set(songWords[Math.floor(Math.random() * songWords.length)]); dref('games/liveSong/lastAnswer').set(null); }
        function submitSongAnswer() { const a = document.getElementById('song-answer').value.trim(); if(a) dref('games/liveSong/lastAnswer').set(a); }

        function renderTrivia(content) { let html = `<div class="text-center mb-8"><div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-brain"></i></div><h2 class="text-4xl font-extrabold text-gray-800">טריוויה</h2></div><div id="trivia-container" class="bg-white rounded-3xl p-8 shadow-xl text-center border-t-8 border-blue-600"><button onclick="startTrivia()" class="bg-blue-600 text-white font-black text-2xl px-10 py-5 rounded-2xl shadow-lg hover:bg-blue-700 transition w-full">שלוף שאלה!</button></div>`; content.innerHTML = html; }
        function startTrivia() { const q = triviaQuestions[Math.floor(Math.random() * triviaQuestions.length)]; let html = `<h3 class="text-2xl font-black text-gray-800 mb-8 leading-tight">${q.q}</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`; q.o.forEach((opt, idx) => { html += `<button onclick="answerTrivia(${idx}, ${q.a})" class="bg-gray-50 border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 text-gray-700 font-bold text-xl py-4 rounded-2xl transition">${opt}</button>`; }); html += `</div>`; document.getElementById('trivia-container').innerHTML = html; }
        function answerTrivia(selected, correct) { if(selected === correct) { document.getElementById('trivia-container').innerHTML = `<div class="text-green-500 text-6xl mb-4"><i class="fas fa-check-circle"></i></div><h3 class="text-3xl font-black text-gray-800 mb-6">נכון!</h3><button onclick="startTrivia()" class="bg-blue-600 text-white font-bold text-xl px-8 py-4 rounded-xl shadow-md w-full">שאלה הבאה</button>`; } else { document.getElementById('trivia-container').innerHTML = `<div class="text-red-500 text-6xl mb-4"><i class="fas fa-times-circle"></i></div><h3 class="text-3xl font-black text-gray-800 mb-6">טעות!</h3><button onclick="startTrivia()" class="bg-gray-800 text-white font-bold text-xl px-8 py-4 rounded-xl shadow-md w-full">שאלה הבאה</button>`; } }

        function renderCountryCity(content) { const data = appData.games.currentCountryCity; let html = `<div class="text-center mb-8"><div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-globe-americas"></i></div><h2 class="text-4xl font-extrabold text-gray-800">ארץ עיר חכם</h2></div><div class="bg-white rounded-3xl p-8 shadow-xl text-center border-t-8 border-green-500 mb-8"><h3 class="text-7xl font-black text-gray-800 mb-8">${data.letter}</h3><button onclick="spinLetter()" class="w-full bg-green-500 text-white font-black text-2xl py-4 rounded-2xl shadow-lg hover:bg-green-600 transition"><i class="fas fa-dice mr-2"></i> הגרל אות</button></div>`; const cats = [ {id:'c_country', name:'ארץ'}, {id:'c_city', name:'עיר'}, {id:'c_animal', name:'חי'}, {id:'c_plant', name:'צומח'}, {id:'c_object', name:'דומם'}, {id:'c_boy', name:'ילד'}, {id:'c_girl', name:'ילדה'}, {id:'c_prof', name:'מקצוע'}, {id:'c_color', name:'צבע'} ]; html += `<div class="bg-gray-50 rounded-3xl p-6 border border-gray-200"><div class="flex flex-col gap-4">`; cats.forEach(c => { html += `<div class="flex items-center"><span class="w-24 font-bold text-gray-600 text-lg">${c.name}:</span><input type="text" id="${c.id}" class="flex-1 p-3 border border-gray-300 rounded-xl font-bold text-lg outline-none focus:ring-2 focus:ring-green-400"></div>`; }); html += `<button onclick="checkCountryCity('${data.letter}')" class="w-full mt-6 bg-gray-800 text-white font-black text-xl py-4 rounded-2xl shadow-lg hover:bg-black transition">שופט אוטומטי - בדוק!</button><div id="cc-results" class="mt-6 text-center"></div></div></div>`; content.innerHTML = html; }
        function spinLetter() { const letters = "אבגדהוזחטיכלמנסעפצקרשת"; dref('games/currentCountryCity/letter').set(letters.charAt(Math.floor(Math.random() * letters.length))); }
        function checkCountryCity(letter) { if(letter === "?") return; const vals = { country: document.getElementById('c_country').value.trim(), color: document.getElementById('c_color').value.trim(), animal: document.getElementById('c_animal').value.trim(), object: document.getElementById('c_object').value.trim(), prof: document.getElementById('c_prof').value.trim() }; let score = 0; let msgs = []; const checkDict = (val, dict, name) => { if(!val) return; if(val.charAt(0) !== letter) { msgs.push(`❌ ${name}: '${val}' לא מתחיל ב-'${letter}'`); return; } if(dict.includes(val)) { score += 10; msgs.push(`✅ ${name}: מושלם!`); } else { msgs.push(`❌ ${name}: לא במילון.`); } }; checkDict(vals.country, dictCountries, "ארץ"); checkDict(vals.color, dictColors, "צבע"); checkDict(vals.animal, dictAnimals, "חי"); checkDict(vals.prof, dictProfessions, "מקצוע"); if(vals.object) { if(vals.object.charAt(0) !== letter) { msgs.push(`❌ דומם: שגוי`); } else if(letter === 'ר' && !dictObjectsR.includes(vals.object)) { msgs.push(`❌ דומם: לא במילון.`); } else { score+=10; msgs.push(`✅ דומם: אושר`); } } document.getElementById('cc-results').innerHTML = `<h3 class="text-3xl font-black text-green-600 mb-4">סך הכל: ${score} נק'!</h3><div class="text-right text-gray-600 font-bold bg-white p-4 rounded-xl border">${msgs.join('<br>')}</div>`; }

        // ==========================================
        //  12. אתחול נתונים (מפות וניווט)
        // ==========================================
        function renderMap(content) {
            const locs = appData.locations || {};
            let html = `
                <div class="text-center mb-6 mt-4">
                    <h2 class="text-3xl font-extrabold text-gray-800"><i class="fas fa-map-marked-alt text-cyan-600 mr-2"></i> מפת מסלול וניווט</h2>
                    <p class="text-gray-500 mt-2">${esc(tripConfig?.title || 'המסלול שלנו')}</p>
                </div>
                <div class="bg-white rounded-3xl shadow-md mb-8 border border-gray-200 overflow-hidden flex flex-col md:flex-row h-[60vh] sm:h-[70vh]">
                    <div class="w-full md:w-1/3 bg-indigo-50 border-b md:border-l border-indigo-100 flex flex-col h-2/5 md:h-full shrink-0">
                        <div class="p-4 bg-indigo-600 text-white shrink-0 shadow-md z-10">
                            <h3 class="font-bold text-lg"><i class="fas fa-route mr-1"></i> נקודות המסלול</h3>
                            <p class="text-xs text-indigo-200 mb-2">לחצו על היעד לפתיחה במפה</p>
                            <div class="flex gap-2">
                                <button onclick="openGoogleMaps(0, 6)" class="flex-1 bg-white text-indigo-700 text-xs font-bold py-2 rounded-xl shadow-sm hover:bg-indigo-100 transition flex items-center justify-center gap-1"><i class="fas fa-external-link-alt"></i> חלק א'</button>
                                <button onclick="openGoogleMaps(6, 13)" class="flex-1 bg-white text-indigo-700 text-xs font-bold py-2 rounded-xl shadow-sm hover:bg-indigo-100 transition flex items-center justify-center gap-1"><i class="fas fa-external-link-alt"></i> חלק ב'</button>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto hide-scrollbar p-3" id="locations-list"></div>
                    </div>
                    <div class="w-full md:w-2/3 h-3/5 md:h-full relative z-0">
                        <div id="leaflet-map-container" class="absolute inset-0 z-0"></div>
                    </div>
                </div>
                <div class="bg-cyan-50 rounded-3xl shadow-sm p-6 mb-8 border border-cyan-100">
                    <h3 class="font-extrabold text-cyan-800 mb-4 text-lg"><i class="fas fa-map-pin mr-2"></i> הוספת יעד עצמאי לניווט מהיר</h3>
                    <div class="flex flex-col gap-3">
                        <input type="text" id="loc-name" placeholder="שם היעד (למשל: סופרמרקט קרוב)" class="w-full p-3 border border-cyan-200 rounded-xl outline-none focus:ring-2 focus:ring-cyan-400 bg-white">
                        <input type="url" id="loc-url" placeholder="קישור ל-Google Maps או Waze" class="w-full p-3 border border-cyan-200 rounded-xl outline-none focus:ring-2 focus:ring-cyan-400 bg-white dir-ltr">
                        <button onclick="addLocation()" class="w-full bg-cyan-600 text-white p-3.5 rounded-xl font-bold shadow-md hover:bg-cyan-700 transition mt-1 text-lg">הוסף לרשימה</button>
                    </div>
                </div>
                <h3 class="font-extrabold text-gray-700 mb-3 ml-2 text-lg">יעדים מועדפים שהוספתם:</h3>
                <div class="flex flex-col gap-3">`;
            const locKeys = Object.keys(locs);
            if(locKeys.length === 0) { 
                html += `<div class="text-center p-6 bg-white rounded-3xl text-gray-500 font-medium border">טרם הוספתם יעדים עצמאיים.</div>`; 
            } else { 
                locKeys.forEach(key => { 
                    const loc = locs[key]; 
                    html += `<div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-cyan-100 text-cyan-600 rounded-full flex items-center justify-center text-lg"><i class="fas fa-map-marker-alt"></i></div><span class="font-bold text-gray-800 text-lg">${loc.name}</span></div><div class="flex gap-2"><a href="${loc.url}" target="_blank" class="bg-gray-800 hover:bg-black text-white px-4 py-2.5 rounded-xl font-bold shadow transition"><i class="fas fa-location-arrow mr-1"></i> נווט</a><button onclick="deleteLocation('${key}')" class="text-red-400 hover:text-red-600 px-3"><i class="fas fa-trash"></i></button></div></div>`; 
                }); 
            }
            html += `</div>`; 
            content.innerHTML = html;
            setTimeout(() => { initLeafletMap(); renderLocationsList(); }, 100);
        }

        function initLeafletMap() {
            const container = document.getElementById('leaflet-map-container');
            if (!container) return;
            if (leafletMapInstance) { leafletMapInstance.remove(); leafletMapInstance = null; }
            leafletMapInstance = L.map('leaflet-map-container').setView([46.1, 11.5], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(leafletMapInstance);
            const latlngs = []; mapMarkers = [];
            routePoints.forEach((point, index) => {
                latlngs.push([point.lat, point.lng]);
                let markerClass = 'route-marker'; 
                if (point.type === 'start') markerClass += ' start-point'; 
                if (point.type === 'end') markerClass += ' end-point';
                const customIcon = L.divIcon({ className: 'custom-div-icon', html: `<div class="${markerClass}" style="width: 30px; height: 30px; line-height: 24px;">${point.id}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
                const marker = L.marker([point.lat, point.lng], { icon: customIcon }).addTo(leafletMapInstance);
                marker.bindPopup(`<div class="text-right" style="direction: rtl;"><div class="text-xl mb-1">${point.icon}</div><h3 class="font-extrabold text-indigo-800 text-lg mb-1">${point.name}</h3><p class="text-sm text-gray-600 leading-tight">${point.desc}</p></div>`);
                mapMarkers.push(marker);
            });
            if (latlngs.length >= 2) {
                const polyline = L.polyline(latlngs, { color: '#4f46e5', weight: 4, opacity: 0.8, dashArray: '10, 10' }).addTo(leafletMapInstance);
                leafletMapInstance.fitBounds(polyline.getBounds(), { padding: [30, 30] });
            } else if (latlngs.length === 1) {
                leafletMapInstance.setView(latlngs[0], 10);
            }
        }

        function renderLocationsList() {
            const container = document.getElementById('locations-list');
            if (!container) return;
            container.innerHTML = '';
            if (routePoints.length === 0) {
                container.innerHTML = `<div class="text-center text-indigo-400 text-sm p-3 leading-relaxed">עדיין אין מסלול.<br><button onclick="navigate('settings')" class="mt-2 underline font-bold text-indigo-600">הוסיפו יעדים בהגדרות ›</button></div>`;
                return;
            }
            routePoints.forEach((point, index) => {
                const isLast = index === routePoints.length - 1;
                container.innerHTML += `<div class="flex cursor-pointer hover:bg-indigo-100 p-2 rounded-xl transition group relative mb-1" onclick="panToLocation(${index})"><div class="flex flex-col items-center ml-3 relative"><div class="w-6 h-6 rounded-full ${point.type === 'start' ? 'bg-emerald-500' : (point.type === 'end' ? 'bg-red-500' : 'bg-indigo-600')} text-white flex items-center justify-center font-bold text-xs z-10 shadow-md group-hover:scale-110 transition">${point.id}</div>${!isLast ? '<div class="w-0.5 bg-indigo-200 flex-1 my-1"></div>' : ''}</div><div class="flex-1"><div class="flex justify-between items-start"><h3 class="font-bold text-gray-800 text-sm leading-tight">${point.name}</h3><span class="text-sm ml-1">${point.icon}</span></div></div></div>`;
            });
        }

        function panToLocation(index) {
            if (!leafletMapInstance || !mapMarkers[index]) return; 
            const point = routePoints[index];
            leafletMapInstance.flyTo([point.lat, point.lng], 12, { duration: 1.5 }); 
            mapMarkers[index].openPopup();
            if (window.innerWidth < 768) { document.getElementById('leaflet-map-container').scrollIntoView({ behavior: 'smooth' }); }
        }

        function openGoogleMaps(startIndex, endIndex) { 
            const subset = routePoints.slice(startIndex, endIndex + 1); 
            let baseUrl = "https://www.google.com/maps/dir/"; 
            subset.forEach(point => { baseUrl += `${point.lat},${point.lng}/`; }); 
            window.open(baseUrl, '_blank'); 
        }

        function addLocation() { 
            const n = document.getElementById('loc-name').value.trim(); 
            const u = document.getElementById('loc-url').value.trim(); 
            if(!n || !u) { return showModal('שגיאה', 'יש למלא שם וקישור חוקי.'); }
            dref(`locations`).push({ name: n, url: u }); 
        }

        function deleteLocation(id) { 
            showModal('מחיקה', 'למחוק יעד זה?', true, () => { dref(`locations/${id}`).remove(); }); 
        }

        // ==========================================
        //  13. (אתחול הנתונים עבר ל-seedInitialData שרץ בעת הקמת טיול חדש)
        // ==========================================
    </script>
</body>
</html>
