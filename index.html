    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; background-color: #f8fafc; }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { background-color: #f3f4f6; }
        .item-row { transition: all 0.2s ease; }
        .item-row:hover { background-color: #f9fafb; }
        .packed-text { text-decoration: line-through; color: #9ca3af; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .avatar-container { position: relative; display: inline-block; cursor: pointer; transition: transform 0.2s; }
        .avatar-container:hover { transform: scale(1.05); }
        .avatar-img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid #4f46e5; background-color: #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .avatar-edit-btn { position: absolute; bottom: 0; right: 0; background-color: #4f46e5; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; }
        .doc-card { transition: all 0.2s ease; }
        .doc-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .check-toggle { transition: all 0.3s; }
        .check-toggle.active { background-color: #10b981; border-color: #10b981; }
        
        @keyframes roll {
            0% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-20px); opacity: 0; }
            51% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .rolling-text { animation: roll 0.15s linear infinite; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 select-none">

        <img id="full-screen-img" src="" alt="Document" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl object-contain">
        <div class="mt-6 flex gap-4">
             <button id="delete-doc-btn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-bold shadow-lg transition"><i class="fas fa-trash mr-2"></i>מחק מסמך</button>
             <button onclick="closeImageModal()" class="bg-white hover:bg-gray-100 text-gray-800 px-6 py-2 rounded-full font-bold shadow-lg transition">סגור</button>

    <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="handleAvatarUpload(event)">

            mishmar: ["יוני", "חנה", "ליאור", "אייל", "הילה", "יובל", "ציוד כללי פרידמן משמר"],

            shared_equip: ["ציוד כללי משותף"]
        };
        const allPeople = [...groups.mishmar, ...groups.adora, ...groups.shared_equip];
        const activeFamilyMembers = [...groups.mishmar.slice(0,6), ...groups.adora.slice(0,6)];
        const adults = ["יוני", "חנה", "עוזיאל", "שרונה"];

        let appData = { 
            items: {}, avatars: {}, documents: {}, 
            wallet: { expenses: {}, planned: {} }, 
            checklists: {}, chores: {}, locations: {}, 
            games: { scores: { mishmar: 0, adora: 0 } } 
        };
        
        let currentTab = '';
        let activeTabGroup = [];
        let currentUploadDocType = "";
        let isUploadingCustomDoc = false;
        let activeGame = '';

        const syncStatus = document.getElementById('sync-status');

        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData.items = data.items || {};
                appData.avatars = data.avatars || {};
                appData.documents = data.documents || {};
                appData.wallet = data.wallet || { expenses: {}, planned: {} };
                if (!appData.wallet.planned) appData.wallet.planned = {};
                if (!appData.wallet.expenses) appData.wallet.expenses = {};
                appData.checklists = data.checklists || { departure: [], arrival: [] };
                appData.chores = data.chores || {};
                appData.locations = data.locations || {};
                appData.games = data.games || { scores: { mishmar: 0, adora: 0 } };
                if (!appData.games.scores) appData.games.scores = { mishmar: 0, adora: 0 };
            }
            
            generateInitialData();
            if(document.getElementById('sync-status')) syncStatus.innerHTML = '<i class="fas fa-cloud-check text-green-300 mr-1"></i> מסונכרן';
            updateTotalProgress();
            
            if(document.getElementById('loading-spinner')) document.getElementById('loading-spinner').remove();
            if(currentTab !== '') renderApp();
        });

        function showModal(title, message, showCancel = false, onOk = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const modal = document.getElementById('custom-modal');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            const okBtn = document.getElementById('modal-ok-btn');
            
            cancelBtn.style.display = showCancel ? 'block' : 'none';
            const newOkBtn = okBtn.cloneNode(true); okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            const newCancelBtn = cancelBtn.cloneNode(true); cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newOkBtn.onclick = () => { modal.classList.add('hidden'); if (onOk) onOk(); };
            newCancelBtn.onclick = () => modal.classList.add('hidden');
            modal.classList.remove('hidden');
        }

        function openModule(moduleName) {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            const tabsContainer = document.getElementById('tabs-container');
            const headerProgress = document.getElementById('header-progress-container');
            document.getElementById('home-btn').classList.remove('hidden');

            if (moduleName === 'games') {
                activeGame = ''; // Reset game state when opening module
            }

            if (groups[moduleName]) {
                activeTabGroup = groups[moduleName];
                currentTab = activeTabGroup[0];
                tabsContainer.classList.remove('hidden');
                headerProgress.classList.remove('hidden');
            } else {
                activeTabGroup = [];
                currentTab = moduleName;
                tabsContainer.classList.add('hidden');
                headerProgress.classList.add('hidden');
            }
            renderApp();
        }

        function goHome() {
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
            document.getElementById('tabs-container').classList.add('hidden');
            document.getElementById('header-progress-container').classList.add('hidden');
            document.getElementById('app-content').innerHTML = '';
            document.getElementById('home-btn').classList.add('hidden');
            currentTab = '';
            activeTabGroup = [];
        }

        function renderApp() {
            if(activeTabGroup.length > 0) renderTabs();
            
            if (currentTab === 'caravan') renderCaravan();
            else if (currentTab === 'wallet') renderWallet();
            else if (currentTab === 'chores') renderChores();
            else if (currentTab === 'map') renderMap();
            else if (currentTab === 'games') renderGamesDashboard();
            else if (currentTab !== '') renderContent(); 
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';

            activeTabGroup.forEach(person => {
                const isActive = person === currentTab;
                let total = 0, packed = 0;
                
                if(appData.items[person]) {
                    Object.values(appData.items[person]).forEach(item => { total++; if(item.packed) packed++; });
                }
                
                const isDone = (packed === total && total > 0);
                const btn = document.createElement('button');
                btn.className = `px-5 py-3 whitespace-nowrap text-sm flex-shrink-0 transition-colors border-b-2 ${isActive ? 'border-indigo-600 text-indigo-700 font-bold bg-indigo-50/50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`;
                
                btn.innerHTML = `
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-base">${person.replace('ציוד כללי ', '')}</span>
                        ${total > 0 ? `<span class="text-xs bg-white border border-gray-200 px-2 py-0.5 rounded-full shadow-sm ${isDone ? 'text-green-500 font-bold' : 'text-gray-500'}">${isDone ? '<i class="fas fa-check mr-1"></i>' : ''}${packed}/${total}</span>` : ''}
                    </div>
                `;
                btn.onclick = () => { currentTab = person; renderApp(); };
                container.appendChild(btn);
            });
        }

                    let inputsHtml = eretzIrCategories.map(cat => 
                        `<div class="flex items-center gap-2 mb-2">

        function checkEretzIr(letter) {
            let points = 0;
            let html = '<div class="bg-white p-6 rounded-xl shadow border border-blue-200 text-center mt-4"><h3 class="font-bold text-xl text-gray-800 mb-4">תוצאות הבדיקה של השופט:</h3><ul class="text-right space-y-3 mb-6 border-b border-gray-100 pb-4">';

            eretzIrCategories.forEach(cat => {
                let inputVal = document.getElementById(`eretz-ir-${cat}`).value.trim();
                let isValid = false;
                let reason = "";

                if(inputVal.length > 1) {
                    if(inputVal.charAt(0) !== letter) {
                        reason = `פסול: לא מתחיל באות ${letter}`;
                    } else {
                        // בדיקת מילונים מובנים
                        if(cat === 'ארץ' && !countriesList.includes(inputVal)) reason = "פסול: לא מופיע במילון הארצות!";
                        else if(cat === 'עיר' && !citiesList.includes(inputVal)) reason = "פסול: לא מופיע במילון הערים המוכרות!";
                        else if(cat === 'חי' && !animalsList.includes(inputVal)) reason = "פסול: לא מוכר במילון החיות המורחב!";
                        else if(cat === 'צבע' && !colorsList.includes(inputVal)) reason = "פסול: לא מופיע במילון הצבעים!";
                        else if(cat === 'מקצוע' && !professionsList.includes(inputVal)) reason = "פסול: לא מוכר במילון המקצועות!";
                        else if(cat === 'דומם' && !objectsList.includes(inputVal)) reason = "פסול: לא מופיע במילון הדומם/חפצים שלנו!";
                        else isValid = true;
                    }
                } else if(inputVal.length > 0) {
                    reason = "קצר מדי";
                } else {
                    reason = "לא הוזן ערך";
                }

                if(isValid) {
                    points++;
                    html += `<li class="bg-green-50 p-2 rounded border border-green-100"><i class="fas fa-check text-green-500 mr-2"></i> <b>${cat}:</b> ${inputVal} <span class="text-green-600 font-bold bg-white px-2 py-0.5 rounded shadow-sm text-xs mr-2">+1</span></li>`;
                } else {
                    html += `<li class="bg-red-50 p-2 rounded border border-red-100"><i class="fas fa-times text-red-500 mr-2"></i> <b>${cat}:</b> <span class="line-through text-gray-500">${inputVal || '---'}</span> <span class="text-xs text-red-500 font-bold block mt-1">${reason}</span></li>`;
                }
            });

            html += `</ul><div class="p-4 bg-blue-100 rounded-xl border border-blue-200 shadow-inner">
                <p class="text-3xl font-black text-blue-800 mb-2">סה"כ הרווחתם: ${points} נקודות!</p>`;
            
            if(points > 0) {
                html += `<p class="text-sm text-blue-700 mt-4 mb-3 font-bold">לאיזו משפחה להוסיף את הניקוד עכשיו?</p>
                         <div class="flex gap-3 justify-center">
                            <button onclick="addScoreAmount('mishmar', ${points})" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-lg font-bold shadow transition">משמר</button>
                            <button onclick="addScoreAmount('adora', ${points})" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-bold shadow transition">אדורה</button>
                         </div>`;
            } else {
                html += `<button onclick="activeGame='eretzir'; renderGamesDashboard()" class="mt-4 bg-white text-blue-600 font-bold py-2 px-6 rounded-lg shadow border border-blue-200 transition hover:bg-blue-50">נסו שוב באות אחרת</button>`;
            }
            html += `</div></div>`;
            document.getElementById('game-area').innerHTML = html;
        }

                const exp = expenses[key];
                const dStr = `${new Date(exp.timestamp).getDate()}/${new Date(exp.timestamp).getMonth()+1}`;
                html += `<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center"><div><p class="font-bold text-gray-800 text-lg">${exp.description}</p><p class="text-sm text-gray-500 mt-1"><span class="bg-gray-100 px-2 py-0.5 rounded text-xs ml-1">${dStr}</span> שילמו: <span class="font-semibold ${exp.paidBy === 'משמר' ? 'text-indigo-600' : 'text-blue-600'}">${exp.paidBy}</span></p></div><div class="flex items-center gap-4"><p class="font-bold text-xl">€${exp.amount}</p><button onclick="deleteExpense('${key}')" class="text-red-400 p-2"><i class="fas fa-trash"></i></button></div></div>`;
            });
            content.innerHTML = html + `</div>`;
        }

        function addPlannedExpense() { const d = document.getElementById('planned-desc').value.trim(); const a = document.getElementById('planned-assignee').value; if(d) db.ref('wallet/planned').push({ description: d, assignee: a || 'טרם הוחלט', done: false, timestamp: firebase.database.ServerValue.TIMESTAMP }); }
        function updatePlannedAssignee(k, a) { db.ref(`wallet/planned/${k}/assignee`).set(a); }
        function togglePlannedExpense(k) { db.ref(`wallet/planned/${k}/done`).set(!appData.wallet.planned[k].done); }
        function deletePlannedExpense(k) { showModal('מחיקה', 'למחוק משימת קנייה?', true, () => db.ref(`wallet/planned/${k}`).remove()); }
        function addExpense() { const d = document.getElementById('wallet-desc').value.trim(); const a = document.getElementById('wallet-amount').value; const p = document.getElementById('wallet-payer').value; if(d && a && p) db.ref('wallet/expenses').push({ description: d, amount: Number(a), paidBy: p, timestamp: firebase.database.ServerValue.TIMESTAMP }); }
        function deleteExpense(id) { showModal('מחיקה', 'למחוק הוצאה?', true, () => db.ref(`wallet/expenses/${id}`).remove()); }

        function handleAvatarUpload(event) {
            const file = event.target.files[0]; if (!file) return; showModal('מעלה...', 'שומר...', false);
            const r = new FileReader(); r.onload = e => {
                const img = new Image(); img.onload = () => {
                    const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
                    if (w > h) { if (w > 200) { h *= 200/w; w = 200; } } else { if (h > 200) { w *= 200/h; h = 200; } }
                    canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    db.ref('avatars/' + currentTab).set(canvas.toDataURL('image/jpeg', 0.6)).then(() => document.getElementById('custom-modal').classList.add('hidden'));
                }; img.src = e.target.result;
            }; r.readAsDataURL(file);
        }

        function openDocUpload(docType) { currentUploadDocType = docType; isUploadingCustomDoc = false; document.getElementById('doc-upload-input').click(); }
        function openCustomDocUpload() { const n = prompt("הכנס שם למסמך (למשל: ביטוח נסיעות):"); if (n && n.trim()) { currentUploadDocType = n.trim(); isUploadingCustomDoc = true; document.getElementById('doc-upload-input').click(); } }
        
        function handleDocumentUpload(event) {
            const file = event.target.files[0]; if (!file) return; showModal('מעלה מסמך...', 'שומר ומאבטח...', false);
            const r = new FileReader(); r.onload = e => {
                const img = new Image(); img.onload = () => {
                    const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
                    if (w > h) { if (w > 1000) { h *= 1000/w; w = 1000; } } else { if (h > 1000) { w *= 1000/h; h = 1000; } }
                    canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    db.ref(`documents/${currentTab}/${currentUploadDocType}`).set(canvas.toDataURL('image/jpeg', 0.7)).then(() => document.getElementById('custom-modal').classList.add('hidden'));
                }; img.src = e.target.result;
            }; r.readAsDataURL(file); event.target.value = '';
        }

        function viewDocument(docType) { const b64 = appData.documents[currentTab][docType]; if(!b64) return; document.getElementById('full-screen-img').src = b64; document.getElementById('image-modal').classList.remove('hidden'); document.getElementById('delete-doc-btn').onclick = () => { showModal('מחיקה', 'למחוק מסמך זה?', true, () => db.ref(`documents/${currentTab}/${docType}`).remove().then(() => closeImageModal())); }; }
        function closeImageModal() { document.getElementById('image-modal').classList.add('hidden'); document.getElementById('full-screen-img').src = ''; }
        
        function getRequiredDocsForTab(tabName) {
            if (tabName === "ציוד כללי משותף") return [{ id: 'flight', name: 'כרטיסי טיסה', icon: 'fa-plane' }, { id: 'villa', name: 'הזמנת וילה', icon: 'fa-house-user' }, { id: 'caravan', name: 'השכרת קרוואנים', icon: 'fa-caravan' }];
            if (tabName.startsWith("ציוד כללי")) return [];
            let docs = [{ id: 'passport', name: 'דרכון', icon: 'fa-passport' }];
            if (adults.includes(tabName)) docs.push({ id: 'driver_license', name: 'רישיון נהיגה', icon: 'fa-id-card' }, { id: 'int_license', name: 'רישיון בינלאומי', icon: 'fa-globe' });
            return docs;
        }

        function renderContent() {
            const content = document.getElementById('app-content');
            const items = appData.items[currentTab] || {};
            const docs = appData.documents[currentTab] || {};
            
            let html = `<div class="flex justify-center mb-2"><div class="avatar-container" onclick="document.getElementById('avatar-upload').click()"><img class="avatar-img" src="${appData.avatars[currentTab] || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentTab.split(' ')[0])}&background=random&color=fff&size=150`}"><div class="avatar-edit-btn"><i class="fas fa-camera"></i></div></div></div><div class="text-center mb-8"><h2 class="text-3xl font-extrabold text-gray-800 bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-500">${currentTab}</h2></div>`;

            const reqDocs = getRequiredDocsForTab(currentTab);
            if (reqDocs.length > 0 || Object.keys(docs).length > 0) {
                html += `<div class="bg-gradient-to-br from-slate-800 to-slate-700 rounded-2xl shadow-lg mb-8 p-4 text-white"><h3 class="font-bold text-lg mb-3"><i class="fas fa-folder-open text-indigo-300 mr-2"></i> מסמכים דיגיטליים</h3><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">`;
                
                reqDocs.forEach(d => {
                    if (docs[d.id]) html += `<div onclick="viewDocument('${d.id}')" class="bg-slate-600/50 border border-slate-500 rounded-xl p-3 text-center cursor-pointer relative"><i class="fas fa-check-circle absolute top-2 left-2 text-green-400"></i><i class="fas ${d.icon} text-3xl text-indigo-300 mb-2"></i><p class="text-sm font-semibold">${d.name}</p></div>`;
                    else html += `<div onclick="openDocUpload('${d.id}')" class="bg-slate-800 border border-dashed border-slate-500 rounded-xl p-3 text-center cursor-pointer"><i class="fas fa-cloud-upload-alt text-3xl text-slate-400 mb-2"></i><p class="text-sm font-semibold text-slate-200">${d.name}</p></div>`;
                });

                Object.keys(docs).forEach(k => {
                    if (!reqDocs.find(rd => rd.id === k)) html += `<div onclick="viewDocument('${k}')" class="bg-slate-600/50 border border-slate-500 rounded-xl p-3 text-center cursor-pointer relative"><i class="fas fa-check-circle absolute top-2 left-2 text-green-400"></i><i class="fas fa-file-image text-3xl text-blue-300 mb-2"></i><p class="text-sm font-semibold truncate">${k}</p></div>`;
                });

                html += `<div onclick="openCustomDocUpload()" class="bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 rounded-xl p-3 text-center flex flex-col justify-center cursor-pointer"><i class="fas fa-plus text-2xl text-white mb-2"></i><p class="text-xs font-bold text-white">הוסף מסמך</p></div></div></div>`;
            }

            const grouped = {};
            Object.keys(items).forEach(k => { if (!grouped[items[k].category]) grouped[items[k].category] = []; grouped[items[k].category].push({ id: k, ...items[k] }); });

            if (Object.keys(grouped).length === 0) { html += `<div class="text-center p-8"><p>הרשימה ריקה.</p></div>`; content.innerHTML = html; return; }

            for (const [cat, catItems] of Object.entries(grouped)) {
                let packed = catItems.filter(i => i.packed).length, total = catItems.length, done = packed === total;
                html += `<div class="bg-white rounded-2xl mb-6 overflow-hidden border ${done ? 'border-green-300' : 'border-gray-200'}"><div class="${done ? 'bg-green-100' : 'bg-gray-100'} px-5 py-4 border-b flex justify-between"><h3 class="font-bold ${done ? 'text-green-800' : 'text-gray-800'} text-xl">${done ? '<i class="fas fa-check-circle mr-2 text-green-600"></i>' : ''}${cat}</h3><span class="text-sm font-bold bg-white px-3 py-1 rounded-full">${packed}/${total}</span></div><ul class="divide-y divide-gray-100">`;
                
                catItems.forEach(i => {
                    html += `
                    <li class="item-row p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center ${i.packed ? 'bg-gray-50' : ''} gap-3 sm:gap-0">
                        <div class="flex items-center gap-4 flex-1 w-full cursor-pointer" onclick="toggleItem('${currentTab}', '${i.id}')">
                            <div class="flex items-center justify-center w-8 h-8 rounded-lg border-2 ${i.packed ? 'border-green-500 bg-green-500' : 'border-gray-300 bg-white'} flex-shrink-0">${i.packed ? '<i class="fas fa-check text-white"></i>' : ''}</div>
                            <div class="flex-1 pr-1"><p class="font-bold ${i.packed ? 'packed-text' : 'text-gray-800'} text-lg">${i.name}</p><p class="text-sm text-gray-500"><span class="font-bold bg-indigo-50 text-indigo-700 px-2 rounded mr-1">כמות: ${i.amount}</span> ${i.note}</p></div>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto justify-end border-t sm:border-0 pt-2 sm:pt-0">
                            <button onclick="editExistingItem('${currentTab}', '${i.id}', '${i.name.replace(/'/g, "\\'")}', '${i.amount}', '${(i.note||'').replace(/'/g, "\\'")}')" class="text-blue-500 bg-blue-50 px-4 py-2 rounded-xl"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteItem('${currentTab}', '${i.id}')" class="text-red-500 bg-red-50 px-4 py-2 rounded-xl"><i class="fas fa-trash"></i></button>
                        </div>
                    </li>`;
                });

                html += `<li class="p-4 bg-slate-50 border-t"><div class="flex flex-col gap-3"><input type="text" id="n-${cat}" placeholder="שם פריט" class="w-full p-3 border rounded-lg"><div class="flex gap-3"><input type="text" id="a-${cat}" placeholder="כמות" class="w-1/3 p-3 border rounded-lg"><input type="text" id="nt-${cat}" placeholder="הערה" class="w-2/3 p-3 border rounded-lg"></div><button onclick="addNewItem('${currentTab}', '${cat}')" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold">הוסף פריט</button></div></li></ul></div>`;
            }
            content.innerHTML = html;
        }

        function toggleItem(p, i) { db.ref(`items/${p}/${i}/packed`).set(!appData.items[p][i].packed); }
        function deleteItem(p, i) { showModal('מחיקה', 'למחוק פריט?', true, () => db.ref(`items/${p}/${i}`).remove()); }
        function editExistingItem(p, i, oldN, oldA, oldNt) { const n=prompt("שם:",oldN); if(n===null)return; const a=prompt("כמות:",oldA); if(a===null)return; const nt=prompt("הערה:",oldNt); if(nt===null)return; db.ref(`items/${p}/${i}`).update({name:n.trim()||oldN, amount:a.trim()||oldA, note:nt.trim()}); }
        function addNewItem(p, c) { const n=document.getElementById(`n-${c}`).value, a=document.getElementById(`a-${c}`).value, nt=document.getElementById(`nt-${c}`).value; if(n) db.ref(`items/${p}`).push({category:c, name:n, amount:a||"1", note:nt, packed:false}); }
        
        function updateTotalProgress() {
            let t = 0, p = 0;
            Object.keys(appData.items || {}).forEach(k => { if(!["💰 ארנק משותף", "🚐 ניהול קרוואן", "🎲 תורנויות"].includes(k)) Object.values(appData.items[k]).forEach(i => { t++; if(i.packed) p++; }); });
            const pct = t === 0 ? 0 : Math.round((p/t)*100);
            if(document.getElementById('total-progress-bar')) document.getElementById('total-progress-bar').style.width = pct+'%';
            if(document.getElementById('total-progress-text')) document.getElementById('total-progress-text').innerText = `התקדמות כללית: ${pct}%`;
        }

        function exportToExcel() {
            if (!appData.items) return alert("אין נתונים");
            let csv = "\uFEFFעבור,קטגוריה,פריט,כמות,הערות,נארז?\n";
            people.forEach(p => { if(appData.items[p] && !["💰 ארנק משותף", "🚐 ניהול קרוואן", "🎲 תורנויות"].includes(p)) Object.values(appData.items[p]).forEach(i => csv += `"${p}","${(i.category||"").replace(/"/g,'""')}","${(i.name||"").replace(/"/g,'""')}","${(i.amount||"").replace(/"/g,'""')}","${(i.note||"").replace(/"/g,'""')}","${i.packed?"כן":"לא"}"\n`); });
            const l = document.createElement("a"); l.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); l.download = "packing_list.csv"; l.click();
        }

        function generateInitialData() {
            if(!appData.chores || Object.keys(appData.chores).length===0) db.ref('chores').set([{name:"שטיפת כלים", assignee:""}, {name:"ריקון שירותים", assignee:""}]);
            if(!appData.checklists || Object.keys(appData.checklists.departure||{}).length===0) { db.ref('checklists/departure').set([{task:"ניתוק חשמל", done:false}, {task:"ריקון מים", done:false}]); db.ref('checklists/arrival').set([{task:"ייצוב קרוואן", done:false}, {task:"חיבור לחשמל", done:false}]); }

            people.forEach(p => {
                if (["💰 ארנק משותף", "🚐 ניהול קרוואן", "🎲 תורנויות"].includes(p)) return;
                if (!appData.items[p]) {
                    let arr = [];
                    if (!p.startsWith("ציוד כללי")) {
                        arr = [{category:"ביגוד יומיום",name:"חולצות קצרות",amount:"8",note:"מכונת כביסה"},{category:"ביגוד חורף",name:"סופטשל",amount:"1",note:"לאוסטריה"},{category:"היגיינה",name:"תיק רחצה",amount:"1",note:""}];
                        if (["עוזיאל", "דביר", "אליה", "יוני", "ליאור", "אייל"].includes(p)) arr.push({category:"דת",name:"תפילין וכיפות",amount:"1",note:""});
                        if (["עוזיאל", "יוני"].includes(p)) arr.push({category:"דת",name:"טלית",amount:"1",note:""});
                        if (["הילה", "להבה"].includes(p)) arr.push({category:"ביגוד",name:"גוזיות",amount:"5",note:""});
                    } else if (p.startsWith("ציוד כללי פרידמן")) {
                        arr = [{category:"לינה",name:"סדינים ושמיכות",amount:"6",note:"קר!"},{category:"שבת",name:"פלטה ומיחם",amount:"1",note:""}];
                    } else {
                        arr = [{category:"משחקים",name:"אליאס",amount:"1",note:""}];
                    }
                    if(arr.length>0){ const o={}; arr.forEach((i,idx)=>o[`item_${Date.now()}_${idx}`]={...i,packed:false}); db.ref(`items/${p}`).set(o); }
                }
            });
        }
    </script>
</body>
</html>
