<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>טיול קרוואנים 2026 - משפחות פרידמן</title>
    
    <!-- Tailwind & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Heebo', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; background-color: #f8fafc; }
        .packed-text { text-decoration: line-through; color: #9ca3af; }
        .item-row { transition: background-color 0.2s ease; }
        .item-row:hover { background-color: #f9fafb; }
        
        .avatar-container { position: relative; display: inline-block; cursor: pointer; transition: transform 0.2s; }
        .avatar-container:hover { transform: scale(1.05); }
        .avatar-img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid #4f46e5; background-color: #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .avatar-edit-btn { position: absolute; bottom: 0; right: 0; background-color: #4f46e5; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; }
        
        .doc-card, .menu-card { transition: all 0.2s ease; }
        .doc-card:active, .menu-card:active { transform: scale(0.97); }
        
        .check-toggle { transition: all 0.3s; }
        .check-toggle.active { background-color: #10b981; border-color: #10b981; color: white; }
        
        .glass-header { background: rgba(79, 70, 229, 0.9); backdrop-filter: blur(10px); }
        
        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .anim-pulse { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 select-none">

    <header class="glass-header text-white p-4 shadow-lg sticky top-0 z-30">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-wide cursor-pointer" onclick="navigate('dashboard')">
                <i class="fas fa-caravan mr-2"></i> פרידמן 2026
            </h1>
            <div class="flex gap-2">
                <button onclick="navigate('dashboard')" id="home-btn" class="hidden text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition shadow backdrop-blur-sm font-bold">
                    <i class="fas fa-home mr-1"></i> ראשי
                </button>
                <button onclick="exportToExcel()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition shadow backdrop-blur-sm font-bold">
                    <i class="fas fa-file-excel mr-1"></i> יצוא
                </button>
            </div>
        </div>
        <div class="flex justify-between items-center text-xs mt-2 opacity-80">
            <span id="sync-status"><i class="fas fa-sync fa-spin mr-1"></i> מתחבר לענן...</span>
        </div>
        <div id="progress-container" class="hidden mt-3">
            <div class="flex justify-between text-xs mb-1 font-bold">
                <span>התקדמות אריזה (קבוצה זו)</span>
                <span id="group-progress-text">0%</span>
            </div>
            <div class="w-full bg-indigo-900 rounded-full h-2 shadow-inner">
                <div id="group-progress-bar" class="bg-green-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <nav id="tabs-container" class="hidden flex overflow-x-auto hide-scrollbar bg-white shadow-sm border-b z-20 sticky top-[72px] px-2 py-1">
        <!-- הלשוניות ייוצרו כאן -->
    </nav>

    <main id="app-content" class="p-4 max-w-3xl mx-auto">
        <div class="text-center mt-20" id="loading-spinner">
            <i class="fas fa-spinner fa-spin text-5xl text-indigo-500"></i>
            <p class="mt-4 text-gray-600 font-medium text-lg" id="loading-text">טוען נתונים...</p>
        </div>
    </main>

    <!-- מודל להודעות מאובטחות -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 transform scale-95 transition-transform duration-300" id="modal-content-box">
            <h3 id="modal-title" class="text-2xl font-extrabold mb-2 text-gray-800"></h3>
            <p id="modal-message" class="text-gray-600 mb-6 text-lg"></p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel-btn" class="px-5 py-2.5 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl hidden font-bold transition">ביטול</button>
                <button id="modal-ok-btn" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-bold shadow-md transition w-full sm:w-auto">אישור</button>
            </div>
        </div>
    </div>

    <!-- מודל לתצוגת מסמכים ותמונות בגדול -->
    <div id="image-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
        <button onclick="closeImageModal()" class="absolute top-6 right-6 text-white text-4xl hover:text-gray-300"><i class="fas fa-times"></i></button>
        <img id="full-screen-img" src="" alt="Document" class="max-w-full max-h-[75vh] rounded-xl shadow-2xl object-contain">
        <div class="mt-8 flex gap-4 w-full max-w-sm justify-center">
             <button id="delete-doc-btn" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg transition flex-1"><i class="fas fa-trash mr-2"></i>מחק</button>
             <button onclick="closeImageModal()" class="bg-white hover:bg-gray-100 text-gray-800 px-8 py-3 rounded-2xl font-bold shadow-lg transition flex-1">סגור</button>
        </div>
    </div>

    <input type="file" id="doc-upload-input" class="hidden" accept="image/*" onchange="handleDocumentUpload(event)">
    <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="handleAvatarUpload(event)">
    <input type="file" id="photo-hunt-upload" class="hidden" accept="image/*" onchange="handlePhotoHuntUpload(event)">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYd3UQO4d1OQN23quXTwMj1WK2wq0chX4",
            authDomain: "tiyul-f886a.firebaseapp.com",
            projectId: "tiyul-f886a",
            storageBucket: "tiyul-f886a.firebasestorage.app",
            messagingSenderId: "644534839473",
            appId: "1:644534839473:web:f7632f361d24183e161a90",
            measurementId: "G-D54PY1YFPQ",
            databaseURL: "https://tiyul-f886a-default-rtdb.europe-west1.firebasedatabase.app" 
        };

        try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); } 
        catch (e) { document.getElementById('loading-text').innerText = "שגיאה באתחול: " + e.message; }
        const db = firebase.database();

        // Data Definitions
        const families = {
            mishmar: { title: "משפחת פרידמן משמר", members: ["יוני", "חנה", "ליאור", "אייל", "הילה", "יובל", "ציוד כללי פרידמן משמר"] },
            adora: { title: "משפחת פרידמן אדורה", members: ["עוזיאל", "שרונה", "להבה", "אליה", "דביר", "הלל", "ציוד כללי פרידמן אדורה"] },
            shared: { title: "ציוד משותף", members: ["ציוד כללי משותף"] }
        };

        const allPeople = [...families.mishmar.members, ...families.adora.members, ...families.shared.members];
        const activeFamilyMembers = allPeople.filter(p => !p.startsWith("ציוד"));

        let appData = { items: {}, avatars: {}, documents: {}, wallet: { expenses: {}, planned: {} }, checklists: {}, chores: {}, locations: {}, pantry: {}, gallery: {}, schedule: {}, emergencyContacts: {}, games: { scores: {}, currentCountryCity: {}, liveSong: {}, photoHunt: {} } };
        
        let currentView = 'dashboard'; 
        let currentGroup = null; 
        let currentTab = null;
        let currentUploadDocType = "";

        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData = { ...appData, ...data };
                // Ensure structural integrity
                if (!appData.wallet) appData.wallet = { expenses: {}, planned: {} };
                if (!appData.wallet.planned) appData.wallet.planned = {};
                if (!appData.wallet.expenses) appData.wallet.expenses = {};
                if (!appData.games) appData.games = { scores: { mishmar: 0, adora: 0 }, currentCountryCity: {}, liveSong: {}, photoHunt: {} };
                if (!appData.games.scores) appData.games.scores = { mishmar: 0, adora: 0 };
                if (!appData.games.currentCountryCity) appData.games.currentCountryCity = { letter: "?" };
                if (!appData.games.liveSong) appData.games.liveSong = { word: "?" };
                if (!appData.games.photoHunt) appData.games.photoHunt = { mission: "לחצו להגרלת משימה ראשונה!" };
                if (!appData.locations) appData.locations = {};
                if (!appData.emergencyContacts) appData.emergencyContacts = {};
            }
            generateInitialData();
            document.getElementById('sync-status').innerHTML = '<i class="fas fa-cloud-check text-green-300 mr-1"></i> מחובר ומעודכן';
            renderApp();
        }, (err) => {
            document.getElementById('sync-status').innerHTML = '<i class="fas fa-exclamation-triangle text-red-300 mr-1"></i> אין קליטה';
        });

        function showModal(title, message, showCancel = false, onOk = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-content-box');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            const okBtn = document.getElementById('modal-ok-btn');
            
            cancelBtn.style.display = showCancel ? 'block' : 'none';
            
            const newOkBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            const newCancelBtn = cancelBtn.cloneNode(true);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);

            const close = () => {
                modal.classList.add('opacity-0');
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            newOkBtn.onclick = () => { close(); if (onOk) onOk(); };
            newCancelBtn.onclick = close;
        }

        function navigate(view, group = null) {
            currentView = view;
            if (group) {
                currentGroup = group;
                currentTab = families[group].members[0];
            }
            renderApp();
        }

        function renderApp() {
            const content = document.getElementById('app-content');
            const tabsContainer = document.getElementById('tabs-container');
            const homeBtn = document.getElementById('home-btn');
            const progressContainer = document.getElementById('progress-container');

            if (currentView === 'dashboard') {
                homeBtn.classList.add('hidden');
                tabsContainer.classList.add('hidden');
                progressContainer.classList.add('hidden');
                renderDashboard(content);
            } else {
                homeBtn.classList.remove('hidden');
                if (['mishmar', 'adora', 'shared'].includes(currentView)) {
                    tabsContainer.classList.remove('hidden');
                    progressContainer.classList.remove('hidden');
                    renderTabs();
                    renderContent();
                    updateGroupProgress();
                } else {
                    tabsContainer.classList.add('hidden');
                    progressContainer.classList.add('hidden');
                    if (currentView === 'caravan') renderCaravan();
                    else if (currentView === 'wallet') renderWallet();
                    else if (currentView === 'map') renderMap();
                    else if (currentView === 'games') renderGames();
                    else if (currentView === 'emergency') renderEmergency();
                    else if (currentView === 'pantry') renderPantry();
                    else if (currentView === 'gallery') renderGallery();
                    else if (currentView === 'schedule') renderSchedule();
                }
            }
            window.scrollTo(0,0);
        }

        function renderDashboard(content) {
            let html = `
                <div class="text-center mb-8 mt-2">
                    <div class="w-24 h-24 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-5xl mx-auto mb-4 drop-shadow-md anim-pulse"><i class="fas fa-caravan"></i></div>
                    <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">מסע קרוואנים 2026</h2>
                </div>
                
                <h3 class="font-extrabold text-gray-700 mb-4 px-2 text-lg">רשימות ציוד ואריזה</h3>
                <div class="grid grid-cols-1 gap-4 mb-8">
                    <div onclick="navigate('mishmar', 'mishmar')" class="menu-card bg-gradient-to-r from-blue-500 to-blue-600 rounded-3xl p-5 shadow-lg text-white cursor-pointer flex items-center justify-between">
                        <div class="flex items-center gap-4"><div class="bg-white/20 p-3 rounded-2xl"><i class="fas fa-backpack text-2xl"></i></div><div><h3 class="font-extrabold text-xl">ציוד משפחת פרידמן משמר</h3><p class="text-blue-100 text-sm">6 נפשות + ציוד כללי</p></div></div><i class="fas fa-chevron-left opacity-70"></i>
                    </div>
                    <div onclick="navigate('adora', 'adora')" class="menu-card bg-gradient-to-r from-indigo-500 to-indigo-600 rounded-3xl p-5 shadow-lg text-white cursor-pointer flex items-center justify-between">
                        <div class="flex items-center gap-4"><div class="bg-white/20 p-3 rounded-2xl"><i class="fas fa-suitcase-rolling text-2xl"></i></div><div><h3 class="font-extrabold text-xl">ציוד משפחת פרידמן אדורה</h3><p class="text-indigo-100 text-sm">6 נפשות + ציוד כללי</p></div></div><i class="fas fa-chevron-left opacity-70"></i>
                    </div>
                    <div onclick="navigate('shared', 'shared')" class="menu-card bg-gradient-to-r from-teal-500 to-teal-600 rounded-3xl p-5 shadow-lg text-white cursor-pointer flex items-center justify-between">
                        <div class="flex items-center gap-4"><div class="bg-white/20 p-3 rounded-2xl"><i class="fas fa-box-open text-2xl"></i></div><div><h3 class="font-extrabold text-xl">ציוד משותף</h3><p class="text-teal-100 text-sm">מזון, פנאי ומשחקים</p></div></div><i class="fas fa-chevron-left opacity-70"></i>
                    </div>
                </div>

                <h3 class="font-extrabold text-gray-700 mb-4 px-2 text-lg">ניהול טיול ופיצ'רים</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div onclick="navigate('caravan')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-steering-wheel"></i></div>
                        <span class="font-bold text-gray-800">ניהול קרוואן</span>
                    </div>
                    <div onclick="navigate('wallet')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-wallet"></i></div>
                        <span class="font-bold text-gray-800">ארנק משותף</span>
                    </div>
                    <div onclick="navigate('map')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-map-marked-alt"></i></div>
                        <span class="font-bold text-gray-800">מפה וניווט</span>
                    </div>
                    <div onclick="navigate('schedule')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-calendar-check"></i></div>
                        <span class="font-bold text-gray-800">לו"ז יומי</span>
                    </div>
                    <div onclick="navigate('games')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-gamepad"></i></div>
                        <span class="font-bold text-gray-800">קונסולת משחקים</span>
                    </div>
                    <div onclick="navigate('gallery')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-camera-retro"></i></div>
                        <span class="font-bold text-gray-800">גלריה משותפת</span>
                    </div>
                    <div onclick="navigate('pantry')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-shopping-basket"></i></div>
                        <span class="font-bold text-gray-800">מזווה ומקרר</span>
                    </div>
                    <div onclick="navigate('emergency')" class="menu-card bg-white rounded-3xl p-5 shadow-md border border-gray-100 text-center cursor-pointer flex flex-col items-center gap-3">
                        <div class="w-14 h-14 bg-red-600 text-white rounded-full flex items-center justify-center text-2xl shadow-lg"><i class="fas fa-first-aid"></i></div>
                        <span class="font-bold text-gray-800">חירום (Offline)</span>
                    </div>
                </div>
            `;
            content.innerHTML = html;
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            if(!currentGroup) return;

            families[currentGroup].members.forEach(person => {
                const isActive = person === currentTab;
                let total = 0, packed = 0;
                
                if(appData.items[person]) {
                    Object.values(appData.items[person]).forEach(item => {
                        total++; if(item.packed) packed++;
                    });
                }
                
                const isDone = (packed === total && total > 0);
                const progressText = total > 0 ? `${packed}/${total}` : '';

                const btn = document.createElement('button');
                btn.className = `px-5 py-3 whitespace-nowrap text-sm flex-shrink-0 transition-colors border-b-[3px] ${isActive ? 'border-indigo-600 text-indigo-700 font-extrabold bg-indigo-50/50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`;
                
                btn.innerHTML = `
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-base">${person}</span>
                        ${total > 0 ? `<span class="text-[10px] bg-white border border-gray-200 px-2 py-0.5 rounded-full shadow-sm ${isDone ? 'text-green-600 font-bold' : 'text-gray-500'}">${isDone ? '<i class="fas fa-check mr-1"></i>' : ''}${progressText}</span>` : ''}
                    </div>
                `;
                btn.onclick = () => { currentTab = person; renderApp(); };
                container.appendChild(btn);
            });
        }

        function renderContent() {
            const content = document.getElementById('app-content');
            const personItems = appData.items[currentTab] || {};
            const personDocs = appData.documents[currentTab] || {};
            
            let html = `
                <div class="flex justify-center mb-2 mt-4">
                    <div class="avatar-container" onclick="document.getElementById('avatar-upload').click()">
                        <img id="current-avatar" class="avatar-img" src="${appData.avatars[currentTab] || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentTab.split(' ')[0])}&background=e0e7ff&color=4f46e5&size=150`}">
                        <div class="avatar-edit-btn"><i class="fas fa-camera"></i></div>
                    </div>
                </div>
                <div class="text-center mb-6">
                    <h2 class="text-3xl font-extrabold text-gray-800">${currentTab}</h2>
                </div>
            `;

            // Documents Section
            const requiredDocs = getRequiredDocsForTab(currentTab);
            html += `
            <div class="bg-white rounded-3xl shadow-sm border border-gray-200 mb-8 overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                    <h3 class="font-bold text-lg text-gray-800"><i class="fas fa-folder-open mr-2 text-indigo-500"></i> מסמכים דיגיטליים</h3>
                </div>
                <div class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-3">`;
            
            requiredDocs.forEach(doc => {
                const hasDoc = !!personDocs[doc.id];
                html += renderDocCard(doc.id, doc.name, doc.icon, hasDoc);
            });

            // Custom Docs
            Object.keys(personDocs).forEach(docId => {
                if(!requiredDocs.find(d => d.id === docId)) {
                    html += renderDocCard(docId, docId, 'fa-file-alt', true);
                }
            });

            // Add new custom doc
            html += `
                <div onclick="addCustomDoc()" class="doc-card bg-indigo-50 border border-dashed border-indigo-300 rounded-2xl p-4 text-center cursor-pointer hover:bg-indigo-100 flex flex-col justify-center items-center">
                    <div class="text-2xl mb-1 text-indigo-400"><i class="fas fa-plus-circle"></i></div>
                    <p class="text-sm font-bold text-indigo-600">הוסף מסמך</p>
                </div>
            </div></div>`;

            // Packing Items Section
            const grouped = {};
            Object.keys(personItems).forEach(key => {
                const item = personItems[key];
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push({ id: key, ...item });
            });

            if (Object.keys(grouped).length === 0) {
                html += `<div class="text-center p-8 bg-white rounded-3xl shadow-sm border"><p class="text-gray-500">הרשימה ריקה.</p></div>`;
                content.innerHTML = html;
                return;
            }

            for (const [category, items] of Object.entries(grouped)) {
                let catPacked = items.filter(i => i.packed).length;

        function handleDocumentUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            showModal('מעלה מסמך...', 'מכווץ ושומר...', false);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > 1200) { height *= 1200 / width; width = 1200; } } 
                    else { if (height > 1200) { width *= 1200 / height; height = 1200; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    db.ref(`documents/${currentTab}/${currentUploadDocType}`).set(canvas.toDataURL('image/jpeg', 0.7)).then(() => {
                        document.getElementById('custom-modal').classList.add('hidden');
                    });
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function viewDocument(docType) {
            const base64String = appData.documents[currentTab][docType];
            if(!base64String) return;
            document.getElementById('full-screen-img').src = base64String;
            document.getElementById('image-modal').classList.remove('hidden');
            document.getElementById('delete-doc-btn').onclick = () => {
                showModal('מחיקת מסמך', 'בטוח שברצונך למחוק?', true, () => {
                    db.ref(`documents/${currentTab}/${docType}`).remove().then(() => closeImageModal());
                });
            };
        }
        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');

        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            showModal('מעלה תמונה...', 'מעדכן פרופיל...', false);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > 200) { height *= 200 / width; width = 200; } } 
                    else { if (height > 200) { width *= 200 / height; height = 200; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    db.ref('avatars/' + currentTab).set(canvas.toDataURL('image/jpeg', 0.6)).then(() => {

            reader.readAsDataURL(file);

        function editExistingItem(person, itemId, oldName, oldAmount, oldNote) {
            const newName = prompt("ערוך שם פריט:", oldName); if (newName === null) return; 
            const newAmount = prompt("ערוך כמות:", oldAmount); if (newAmount === null) return;
            const newNote = prompt("ערוך הערה:", oldNote); if (newNote === null) return;

            db.ref(`items/${person}/${itemId}`).update({
                name: newName.trim() || oldName,
                amount: newAmount.trim() || oldAmount,
                note: newNote.trim()
            });
        }

        function addNewItem(person, category) {
            const nameInput = document.getElementById(`new-name-${category}`);
            const amountInput = document.getElementById(`new-amount-${category}`);
            const noteInput = document.getElementById(`new-note-${category}`);
            if(!nameInput.value.trim()) return showModal('חסר שם', 'הזן שם לפריט.');
            db.ref(`items/${person}`).push({ category, name: nameInput.value.trim(), amount: amountInput.value.trim() || "1", note: noteInput.value.trim(), packed: false });
        }

        function updateGroupProgress() {
            if(!currentGroup) return;
            let total = 0, packed = 0;
            families[currentGroup].members.forEach(person => {
                if(appData.items[person]) {
                    Object.values(appData.items[person]).forEach(item => { total++; if(item.packed) packed++; });
                }
            });
            const percent = total === 0 ? 0 : Math.round((packed / total) * 100);
            document.getElementById('group-progress-bar').style.width = `${percent}%`;
            document.getElementById('group-progress-text').innerText = `${percent}%`;

        function handlePhotoHuntUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            showModal('מעלה תמונה...', 'מצרף את ההוכחה לגלריה המשותפת...', false);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > 800) { height *= 800 / width; width = 800; } } 
                    else { if (height > 800) { width *= 800 / height; height = 800; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    
                    const uploaderName = prompt("כל הכבוד! מי צילם?") || "אנונימי";
                    const currentMission = appData.games.photoHunt?.mission || "משימת צילום";
                    db.ref('gallery').push({ url: canvas.toDataURL('image/jpeg', 0.6), uploader: `🎯 משימה: ${currentMission} (${uploaderName})` }).then(() => {
                        document.getElementById('custom-modal').classList.add('hidden');
                        showModal('אלופים!', 'התמונה עלתה בהצלחה לגלריה. אל תשכחו לתת לעצמכם נקודות!');
                    });
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function checkCityCountry() {
            const letter = appData.games.currentCountryCity?.letter;
            if(!letter || letter === "?") return showModal("שגיאה", "יש להגריל אות קודם!");
            
            let points = 0;
            let resultsHTML = `<div class="text-right mt-4 bg-gray-50 p-4 rounded-xl text-sm max-h-60 overflow-y-auto">`;
            
            document.querySelectorAll('[id^="cc-"]').forEach(inp => {
                const cat = inp.getAttribute('data-cat');
                const val = inp.value.trim();
                let isCorrect = false;
                let reason = "";

                if(val === "") {
                    reason = "לא הוזן ערך";
                } else if(!val.startsWith(letter)) {
                    reason = `לא מתחיל באות ${letter}`;
                } else if(val.length < 2) {
                    reason = "מילה קצרה מדי";
                } else {
                    if(cat === 'ארץ') {
                        isCorrect = gameDict.country.includes(val);
                        reason = isCorrect ? "V" : "לא במילון הארצות";
                    } else if(cat === 'עיר') {
                        isCorrect = gameDict.city.includes(val);
                        reason = isCorrect ? "V" : "לא במילון הערים";
                    } else if(cat === 'חי') {
                        isCorrect = gameDict.animal.includes(val);
                        reason = isCorrect ? "V" : "לא במילון החיות";
                    } else if(cat === 'צבע') {
                        isCorrect = gameDict.color.includes(val);
                        reason = isCorrect ? "V" : "לא במילון הצבעים";
                    } else if(cat === 'דומם') {
                        isCorrect = gameDict.object.includes(val);
                        reason = isCorrect ? "V" : "לא במילון הדומם/חפצים";
                    } else if(cat === 'מקצוע') {
                        isCorrect = gameDict.profession.includes(val);
                        reason = isCorrect ? "V" : "לא במילון המקצועות";
                    } else {
                        isCorrect = true; 
                        reason = "V (לבדוק בעל פה)";
                    }
                }

                if(isCorrect) {
                    inp.classList.add('border-green-500');
                    inp.classList.remove('border-red-500');
                    points++;
                    resultsHTML += `<p class="text-green-600 font-bold"><i class="fas fa-check"></i> ${cat}: ${val}</p>`;
                } else {
                    inp.classList.add('border-red-500');
                    inp.classList.remove('border-green-500');
                    resultsHTML += `<p class="text-red-500"><i class="fas fa-times"></i> ${cat}: ${val ? val : '-'} (${reason})</p>`;
                }
            });
            
            resultsHTML += `</div>`;
            showModal(`בדיקה הושלמה!`, `הרווחתם ${points} נקודות. אל תשכחו להוסיף אותן למשפחה שלכם בלוח התוצאות!`, false);
            document.getElementById('modal-message').innerHTML += resultsHTML;
        }

                    <p class="text-gray-500 mt-2 font-medium">מה התוכנית להיום ומי כבר מוכן לצאת?</p>
                </div>
                
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200 mb-6">
                    <div class="flex flex-col gap-3">
                        <input type="text" id="sched-time" placeholder="שעה (למשל: 10:00)" class="w-full p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-400 bg-gray-50 font-bold">
                        <input type="text" id="sched-task" placeholder="משימה (למשל: יציאה למפלים)" class="w-full p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-400 bg-gray-50 font-bold">
                        <button onclick="addScheduleItem()" class="w-full bg-purple-600 text-white p-3.5 rounded-xl font-bold shadow-md hover:bg-purple-700 transition mt-1 text-lg">הוסף ללו"ז</button>
                    </div>
                </div>

                <div class="bg-purple-50 rounded-3xl p-5 mb-8 border border-purple-100 flex justify-around items-center">
                    <div class="text-center">
                        <p class="font-bold text-purple-900 mb-2">משמר</p>
                        <button onclick="db.ref('schedule/ready_mishmar').set(!${sched.ready_mishmar || false})" class="w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-md transition ${sched.ready_mishmar ? 'bg-green-500 text-white' : 'bg-white text-gray-300'}"><i class="fas fa-thumbs-up"></i></button>
                        <p class="text-xs mt-1 font-bold ${sched.ready_mishmar ? 'text-green-600' : 'text-gray-400'}">${sched.ready_mishmar ? 'מוכנים!' : 'מתארגנים'}</p>
                    </div>
                    <div class="text-center">
                        <p class="font-bold text-purple-900 mb-2">אדורה</p>
                        <button onclick="db.ref('schedule/ready_adora').set(!${sched.ready_adora || false})" class="w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-md transition ${sched.ready_adora ? 'bg-green-500 text-white' : 'bg-white text-gray-300'}"><i class="fas fa-thumbs-up"></i></button>
                        <p class="text-xs mt-1 font-bold ${sched.ready_adora ? 'text-green-600' : 'text-gray-400'}">${sched.ready_adora ? 'מוכנים!' : 'מתארגנים'}</p>
                    </div>
                </div>

                <div class="relative border-r-2 border-purple-200 pr-6 ml-4">
            `;

            const events = sched.events || {};
            Object.keys(events).forEach(key => {
                const ev = events[key];
                html += `
                <div class="mb-6 relative">
                    <div class="absolute -right-[31px] top-1 w-4 h-4 bg-purple-500 rounded-full border-4 border-white shadow-sm"></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <span class="text-purple-600 font-extrabold text-lg">${ev.time}</span>
                            <p class="font-bold text-gray-800 text-lg mt-1">${ev.task}</p>
                        </div>
                        <button onclick="db.ref('schedule/events/${key}').remove()" class="text-gray-300 hover:text-red-500 p-2"><i class="fas fa-times text-xl"></i></button>
                    </div>
                </div>`;
            });
            
            html += `</div>`;
            content.innerHTML = html;
        }

        function addScheduleItem() {
            const time = document.getElementById('sched-time').value.trim();
            const task = document.getElementById('sched-task').value.trim();
            if(!time || !task) return;
            db.ref(`schedule/events`).push({ time, task });
        }

        if ('serviceWorker' in navigator) {
            // Placeholder for real PWA service worker registration
            console.log("PWA Ready context.");
        }

        function generateInitialData() {
            // תורנויות
            if (!appData.chores || Object.keys(appData.chores || {}).length === 0) {
                db.ref('chores').set([
                    { name: "שטיפת כלים", assignee: "" },
                    { name: "ריקון שירותים כימיים", assignee: "" },
                    { name: "הכנת ארוחת בוקר", assignee: "" }
                ]);
            }

            // צ'קליסט קרוואן
            if (!appData.checklists || Object.keys(appData.checklists.departure || {}).length === 0) {
                db.ref('checklists/departure').set([
                    { task: "ניתוק חשמל וגלגול כבל", done: false },
                    { task: "ניתוק מים וסגירת ברז", done: false },
                    { task: "ריקון מים אפורים/קסטה", done: false },
                    { task: "סגירת ברז גז ראשי", done: false },
                    { task: "סגירת כל החלונות והסקיילייט", done: false },
                    { task: "נעילת ארונות ומקרר", done: false },
                    { task: "קיפול מדרגה ומרקיזה", done: false }
                ]);
                db.ref('checklists/arrival').set([
                    { task: "ייצוב הקרוואן (צ'וקים)", done: false },
                    { task: "חיבור כבל חשמל", done: false },
                    { task: "פתיחת ברז מים וגז", done: false }
                ]);
            }

            // רשימות אריזה ענקיות וציוד דת (כפי שביקשת)
            allPeople.forEach(person => {
                if (["💰 ארנק משותף", "🚐 ניהול קרוואן", "🎲 תורנויות", "📍 מפת מסלול"].includes(person)) return;
                
                if (!appData.items[person] || Object.keys(appData.items[person]).length === 0) {
                    let itemsArray = [];
                    
                    if (!person.startsWith("ציוד כללי")) {
                        itemsArray = [
                            { category: "ביגוד יומיום", name: "חולצות קצרות", amount: "8", note: "יש כביסה" },
                            { category: "ביגוד יומיום", name: "מכנסיים קצרים", amount: "5", note: "" },
                            { category: "ביגוד יומיום", name: "מכנסיים ארוכים", amount: "3", note: "" },
                            { category: "ביגוד יומיום", name: "לבנים / תחתונים", amount: "10", note: "" },
                            { category: "ביגוד יומיום", name: "גרביים", amount: "8", note: "" },
                            { category: "ביגוד חורף", name: "מעיל סופטשל", amount: "1", note: "לאוסטריה" },
                            { category: "ביגוד חורף", name: "חולצות ארוכות", amount: "2", note: "שיטת הבצל" },
                            { category: "ביגוד חורף", name: "כובע גרב וכפפות", amount: "1", note: "" },
                            { category: "הנעלה", name: "נעלי הליכה סגורות", amount: "1", note: "" },
                            { category: "הנעלה", name: "סנדלים", amount: "1", note: "" },
                            { category: "הנעלה", name: "כפכפים", amount: "1", note: "למקלחות" },
                            { category: "בריכה וים", name: "בגדי ים", amount: "2", note: "" },
                            { category: "היגיינה ורחצה", name: "תיק רחצה אישי", amount: "1", note: "שמפו, מברשת..." },
                            { category: "היגיינה ורחצה", name: "מגבת רחצה ומגבת בריכה", amount: "2", note: "רצוי מיקרופייבר" }
                        ];
                        if (["עוזיאל", "דביר", "אליה", "יוני", "ליאור", "אייל"].includes(person)) {
                            itemsArray.push({ category: "דת ורוח", name: "תפילין", amount: "1", note: "" });
                            itemsArray.push({ category: "דת ורוח", name: "כיפות", amount: "3", note: "" });
                            itemsArray.push({ category: "דת ורוח", name: "ציצית", amount: "3", note: "" });
                        }
                        if (["עוזיאל", "יוני"].includes(person)) {
                            itemsArray.push({ category: "דת ורוח", name: "טלית", amount: "1", note: "לשבתות" });
                        }
                        if (person === "הילה" || person === "להבה") {
                            itemsArray.push({ category: "ביגוד יומיום", name: "גוזיות", amount: "5", note: "" });
                        }
                        if (person === "יובל" || person === "הלל") {
                            itemsArray.push({ category: "ציוד תינוקות", name: "חיתולים", amount: "1 חבילה", note: "" });
                            itemsArray.push({ category: "ציוד תינוקות", name: "מגבונים", amount: "5", note: "" });
                            itemsArray.push({ category: "ציוד תינוקות", name: "מנשא גב", amount: "1", note: "" });
                        }
                    } else if (person.startsWith("ציוד כללי פרידמן")) {
                        itemsArray = [
                            { category: "לינה בקרוואן", name: "סדינים ציפות וכריות", amount: "6 סטים", note: "" },
                            { category: "לינה בקרוואן", name: "שמיכות", amount: "6", note: "קר בלילות!" },
                            { category: "שבת וכשרות", name: "פלטת שבת", amount: "1", note: "לבדוק מתח" },
                            { category: "שבת וכשרות", name: "מיחם / תרמוס", amount: "1", note: "" },
                            { category: "שבת וכשרות", name: "נרונים, כוס קידוש", amount: "1 ערכה", note: "" },
                            { category: "שבת וכשרות", name: "סירים ומחבתות (מוטבלים)", amount: "3", note: "" },
                            { category: "שבת וכשרות", name: "כלים מפלסטיק קשיח", amount: "לכולם", note: "סכו״ם צלחות" }
                        ];
                    } else if (person === "ציוד כללי משותף") {
                        itemsArray = [
                            { category: "פנאי", name: "אליאס ומשחקי קופסא", amount: "1", note: "" },
                            { category: "אוכל משותף", name: "פקל קפה", amount: "1", note: "" },
                            { category: "חשמל", name: "מתאמים לאירופה", amount: "4", note: "" },
                            { category: "רפואה", name: "עזרה ראשונה + כדורי בחילה", amount: "1", note: "לאוסטריה" }
                        ];
                    }

                    if(itemsArray.length > 0) {
                        const personItemsObj = {};
                        itemsArray.forEach((item, index) => {
                            personItemsObj[`item_${Date.now()}_${index}`] = { ...item, packed: false };
                        });
                        db.ref(`items/${person}`).set(personItemsObj);
                    }
                }
            });
        }
    </script>
</body>
</html>
