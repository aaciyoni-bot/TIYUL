<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --brand: #4338ca;        /* indigo-700 */
            --brand-600: #4f46e5;
            --brand-500: #6366f1;
            --brand-50: #eef2ff;
            --ink: #0f172a;          /* slate-900 */
            --ink-soft: #334155;     /* slate-700 */
            --muted: #64748b;        /* slate-500 */
            --line: #e5e7eb;
            --bg: #f4f5f9;
            --card: #ffffff;
            --ok: #10b981;
            --radius: 22px;
            --shadow-sm: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05);
            --shadow-md: 0 6px 18px -4px rgba(15,23,42,.12), 0 2px 6px -2px rgba(15,23,42,.08);
            --shadow-lg: 0 24px 48px -12px rgba(49,46,129,.28);
        }
        * { -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: 'Heebo', system-ui, sans-serif; background-color: var(--bg); color: var(--ink); }
        h1,h2,h3,h4 { font-family: 'Assistant', 'Heebo', sans-serif; letter-spacing: -0.01em; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { border-bottom: 4px solid var(--brand-600); color: var(--brand-600); font-weight: bold; background-color: #f8fafc; }
        .packed-text { text-decoration: line-through; color: #9ca3af; }
        .item-row { transition: background-color 0.2s ease; }
        .item-row:hover { background-color: #f9fafb; }
        .pre-wrap { white-space: pre-wrap; }

        /* Accessible focus ring everywhere */
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
            outline: 3px solid var(--brand-500); outline-offset: 2px; border-radius: 10px;
        }

        .avatar-container { position: relative; display: inline-block; cursor: pointer; transition: transform 0.2s; }
        .avatar-container:hover { transform: scale(1.05); }
        .avatar-img { width: 84px; height: 84px; object-fit: cover; border-radius: 50%; border: 3px solid var(--brand-600); background-color: #e5e7eb; box-shadow: 0 4px 10px rgba(67,56,202,.18); }
        .avatar-edit-btn { position: absolute; bottom: 0; inset-inline-end: 0; background-color: var(--brand-600); color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; }

        .doc-card, .menu-card { transition: transform .18s ease, box-shadow .18s ease; cursor: pointer; }
        .menu-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .doc-card:active, .menu-card:active { transform: scale(0.97); }
        .check-toggle { transition: all 0.25s; cursor: pointer; }
        .check-toggle.active { background-color: var(--ok); border-color: var(--ok); color: white; }
        .glass-header { background: linear-gradient(120deg, rgba(67,56,202,.97), rgba(79,70,229,.95)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--ok); }

        /* Buttons pressed feedback */
        button { transition: transform .12s ease, filter .15s ease, background-color .15s ease, box-shadow .15s ease; }
        button:active { transform: scale(.98); }

        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .anim-pulse { animation: pulse-soft 2s infinite; }
        @keyframes alert-flash { 0%, 100% { background-color: rgba(220, 38, 38, 0.95); } 50% { background-color: rgba(185, 28, 28, 1); transform: scale(1.02); } }
        .sos-flashing { animation: alert-flash 1.5s infinite; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp .45s cubic-bezier(.22,1,.36,1) both; }

        .playing-card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100px; height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; font-size: 3.5rem; position: relative; cursor: pointer; transition: transform 0.2s; }
        .playing-card:hover { transform: translateY(-5px); }
        .playing-card .suit-top { position: absolute; top: 8px; inset-inline-start: 8px; font-size: 1.5rem; line-height: 1; }
        .playing-card .suit-bottom { position: absolute; bottom: 8px; inset-inline-end: 8px; font-size: 1.5rem; line-height: 1; transform: rotate(180deg); }
        .card-red { color: #ef4444; } .card-black { color: #1f2937; }
        .card-blue { color: #2563eb; } .card-green { color: #16a34a; } .card-yellow { color: #eab308; }

        .leaflet-container { z-index: 10 !important; font-family: 'Heebo', sans-serif; }
        .route-marker { background-color: var(--brand-600); color: white; border-radius: 50%; text-align: center; font-weight: bold; font-size: 14px; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .route-marker.end-point { background-color: #ef4444; }
        .route-marker.start-point { background-color: #10b981; }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-5deg); } 50% { transform: translateX(5px) rotate(5deg); } 75% { transform: translateX(-5px) rotate(-5deg); } 100% { transform: translateX(0); } }
        .duel-shake { animation: shake 0.5s infinite; }

        /* Onboarding / wizard */
        .aurora { position: fixed; inset: 0; overflow: hidden; z-index: 0; background: #0b1024; }
        .aurora::before, .aurora::after { content:""; position:absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity:.55; }
        .aurora::before { background: radial-gradient(circle, #6366f1, transparent 60%); top: -10vmax; inset-inline-end: -10vmax; }
        .aurora::after  { background: radial-gradient(circle, #22d3ee, transparent 60%); bottom: -15vmax; inset-inline-start: -10vmax; }
        .field-label { display:block; font-size:.8rem; font-weight:800; color:var(--muted); margin-bottom:.35rem; }
        .field { width:100%; padding:.85rem 1rem; border:1.5px solid var(--line); border-radius:14px; outline:none; font-weight:600; font-size:1.05rem; background:#fff; transition:border-color .15s, box-shadow .15s; }
        .field:focus { border-color: var(--brand-500); box-shadow: 0 0 0 4px rgba(99,102,241,.15); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- סרגל עליון עם חץ חזור חכם -->

        <div class="flex justify-between items-center gap-2">
            <h1 id="brand-title" class="text-lg sm:text-xl font-extrabold tracking-wide cursor-pointer flex items-center min-w-0" onclick="navigate('dashboard')">
                <i class="fas fa-caravan ml-2 text-2xl shrink-0"></i> <span class="truncate">הטיול שלנו</span>
            </h1>
            <div class="flex gap-2 items-center shrink-0">
                <button onclick="changeUserIdentity()" id="header-user-btn" class="text-xs bg-white/15 hover:bg-white/25 border border-white/20 px-3 py-1.5 rounded-full transition shadow backdrop-blur-sm font-bold flex items-center" title="החלף משתמש">
                    <i class="fas fa-user-circle ml-1.5 text-sm"></i> <span id="header-user-name">אורח</span>
                </button>
                <button onclick="goBack()" id="back-btn" class="hidden text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition shadow backdrop-blur-sm font-bold flex items-center">
                    <i class="fas fa-arrow-right ml-1.5"></i> חזור
                </button>
                <button onclick="openTripMenu()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition shadow backdrop-blur-sm font-bold" title="תפריט טיול">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>

        <div class="flex justify-between items-center text-xs mt-2 opacity-90">
            <span id="sync-status"><i class="fas fa-sync fa-spin ml-1"></i> מתחבר לענן...</span>
            <span id="total-points-display" class="font-bold hidden"></span>
        </div>

        <div id="progress-container" class="hidden mt-3">
            <div class="flex justify-between text-xs mb-1 font-bold">
                <span>התקדמות אריזה</span>
                <span id="group-progress-text">0%</span>
            </div>
            <div class="w-full bg-indigo-900 rounded-full h-2 shadow-inner">
                <div id="group-progress-bar" class="bg-green-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <nav id="tabs-container" class="hidden flex overflow-x-auto hide-scrollbar bg-white shadow-sm border-b z-20 sticky top-[76px] px-2 py-1"></nav>

    <!-- אנימציית טעינה -->

        <i class="fas fa-spinner fa-spin text-5xl text-indigo-500"></i>
        <p class="mt-4 text-gray-600 font-medium text-lg" id="loading-text">טוען נתונים מהענן...</p>
    </div>

    <!-- תוכן ראשי -->
    <main id="app-content" class="p-4 max-w-3xl mx-auto"></main>

    <!-- מודלים / חלונות קופצים -->
    <div id="welcome-modal" style="display: none;" class="fixed inset-0 z-[100] overflow-y-auto"><div class="flex items-center justify-center min-h-screen p-4"><div class="fixed inset-0 bg-indigo-900/95 backdrop-blur-md"></div><div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 text-center border-4 border-indigo-200"><div class="text-6xl mb-4 bg-indigo-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto shadow-inner">👋</div><h2 class="text-3xl font-extrabold text-gray-800 mb-2">מי מחזיק במכשיר?</h2><p class="text-gray-500 mb-8 font-medium">אנא בחר את שמך:</p><div class="relative"><select id="welcome-user-select" class="w-full p-4 border-2 border-indigo-200 rounded-2xl text-xl font-bold bg-indigo-50 text-indigo-800 mb-8 outline-none focus:ring-4 focus:ring-indigo-300 transition text-center appearance-none cursor-pointer"></select><i class="fas fa-chevron-down absolute left-5 top-5 text-indigo-400 text-xl pointer-events-none"></i></div><button onclick="saveUserIdentity()" class="w-full bg-indigo-600 text-white font-black text-2xl py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition transform hover:scale-105">המשך לטיול! 🚐</button></div></div></div>
    
    <div id="custom-modal" style="display: none;" class="fixed inset-0 z-[80] overflow-y-auto"><div class="flex items-center justify-center min-h-screen p-4"><div class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div><div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 transform transition-transform" id="modal-content-box"><h3 id="modal-title" class="text-2xl font-extrabold mb-2 text-gray-800"></h3><p id="modal-message" class="text-gray-600 mb-6 text-lg"></p><div class="flex justify-end gap-3"><button id="modal-cancel-btn" style="display: none;" class="px-5 py-2.5 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold transition">ביטול</button><button id="modal-ok-btn" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-bold shadow-md transition w-full sm:w-auto">אישור</button></div></div></div></div>
    
    <div id="edit-item-modal" style="display: none;" class="fixed inset-0 z-[82] overflow-y-auto"><div class="flex items-center justify-center min-h-screen p-4"><div class="fixed inset-0 bg-black/70 backdrop-blur-sm"></div><div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-md p-6"><h3 class="text-2xl font-extrabold mb-4 text-indigo-800 border-b pb-2"><i class="fas fa-edit mr-2"></i> עריכת פריט</h3><div class="flex flex-col gap-4"><div><label class="block text-sm font-bold text-gray-600 mb-1">שם הפריט</label><input type="text" id="edit-item-name" class="w-full p-3 border border-gray-300 rounded-xl outline-none font-bold"></div><div><label class="block text-sm font-bold text-gray-600 mb-1">כמות</label><input type="text" id="edit-item-qty" class="w-full p-3 border border-gray-300 rounded-xl outline-none"></div><div><label class="block text-sm font-bold text-gray-600 mb-1">פירוט</label><textarea id="edit-item-note" rows="4" class="w-full p-3 border border-gray-300 rounded-xl outline-none"></textarea></div></div><div class="flex justify-end gap-3 mt-6"><button onclick="document.getElementById('edit-item-modal').style.display='none'" class="px-5 py-2.5 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold">ביטול</button><button onclick="saveEditedItem()" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-bold">שמור שינויים</button></div></div></div></div>
    
    <!-- קופה רושמת (מזווה וארנק משולב) -->
    <div id="buy-modal" style="display: none;" class="fixed inset-0 z-[83] overflow-y-auto"><div class="flex items-center justify-center min-h-screen p-4"><div class="fixed inset-0 bg-black/80 backdrop-blur-sm"></div><div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 border-t-8 border-orange-500"><div class="text-center mb-4"><div class="w-16 h-16 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-2"><i class="fas fa-cash-register"></i></div><h3 class="text-2xl font-extrabold text-gray-800">הכנסה למזווה</h3><p class="text-orange-600 font-bold mt-1 text-lg" id="buy-item-name"></p></div><div class="bg-gray-50 p-4 rounded-2xl mb-6 border border-gray-200"><div class="flex items-center justify-between mb-4"><span class="font-bold text-gray-700">הוסף לארנק?</span><div class="relative inline-block w-12 mr-2 align-middle select-none"><input type="checkbox" id="sync-wallet-toggle" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 bottom-0 m-auto"/><label for="sync-wallet-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label></div></div><div id="buy-cost-fields" class="transition-opacity duration-300"><label class="block text-sm font-bold text-gray-600 mb-1">כמה זה עלה? (₪)</label><input type="number" id="buy-item-cost" class="w-full p-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-orange-400 mb-3 text-lg font-bold text-center"><label class="block text-sm font-bold text-gray-600 mb-1">מי שילם בקופה?</label><select id="buy-item-payer" class="w-full p-3 border border-gray-300 rounded-xl font-bold"></select></div></div><div class="flex gap-3"><button onclick="document.getElementById('buy-modal').style.display='none'" class="flex-1 px-4 py-3 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold">ביטול</button><button onclick="confirmBuyAndSync()" class="flex-1 px-4 py-3 bg-orange-500 text-white rounded-xl hover:bg-orange-600 font-bold"><i class="fas fa-check mr-1"></i> אישור</button></div></div></div></div>
    
    <div id="image-modal" style="display: none;" class="fixed inset-0 z-[85] overflow-y-auto"><div class="flex flex-col items-center justify-center min-h-screen p-4"><div class="fixed inset-0 bg-black/95 backdrop-blur-md"></div><button onclick="closeImageModal()" class="absolute top-6 right-6 text-white text-4xl z-[90]"><i class="fas fa-times"></i></button><img id="full-screen-img" src="" class="relative max-w-full max-h-[75vh] rounded-xl shadow-2xl object-contain z-[90]"><div class="relative mt-8 flex gap-4 w-full max-w-sm justify-center z-[90]"><button id="delete-doc-btn" class="bg-red-500 text-white px-8 py-3 rounded-2xl font-bold flex-1"><i class="fas fa-trash mr-2"></i>מחק</button><button onclick="closeImageModal()" class="bg-white text-gray-800 px-8 py-3 rounded-2xl font-bold flex-1">סגור</button></div></div></div>
    
    <div id="duel-alert-modal" style="display: none;" class="fixed inset-0 z-[95] overflow-y-auto"><div class="flex items-center justify-center min-h-screen p-4"><div class="fixed inset-0 bg-black/80 backdrop-blur-md"></div><div class="relative bg-gradient-to-br from-purple-600 to-indigo-800 rounded-3xl shadow-2xl w-full max-w-md p-8 text-center border-4 border-yellow-400 duel-shake"><i class="fas fa-bolt text-6xl text-yellow-400 mb-4 drop-shadow-lg"></i><h2 class="text-4xl font-extrabold text-white mb-2 uppercase">קריאת תיגר!</h2><div class="bg-black/30 p-4 rounded-xl mb-6 mt-4 border border-white/20"><p id="duel-challenger" class="text-xl text-indigo-200 font-bold mb-1"></p><p id="duel-target" class="text-3xl font-black text-yellow-400 mb-4"></p><p class="text-sm text-gray-300 mb-2">המשימה שלך:</p><p id="duel-task" class="text-2xl text-white font-bold"></p></div><button onclick="document.getElementById('duel-alert-modal').style.display='none'" class="w-full bg-white text-indigo-900 font-black text-xl py-3 rounded-xl shadow-lg">הבנתי, סגור</button></div></div></div>
    
    <div id="sos-alert-modal" style="display: none;" class="fixed inset-0 z-[96] overflow-y-auto"><div class="flex items-center justify-center min-h-screen p-4"><div class="fixed inset-0 bg-black/80 backdrop-blur-md"></div><div class="relative sos-flashing rounded-3xl shadow-2xl w-full max-w-sm p-8 text-center border-4 border-white"><i class="fas fa-bullhorn text-6xl text-white mb-4"></i><h2 class="text-4xl font-extrabold text-white mb-2 tracking-widest">קריאת מצוקה!</h2><p id="sos-sender-name" class="text-2xl font-bold text-red-100 mb-6 bg-black/20 py-2 rounded-xl"></p><p class="text-white mb-6 text-lg font-medium">שודר מיקום מדויק. לחצו כדי לנווט!</p><a id="sos-nav-link" href="#" target="_blank" class="block w-full bg-white text-red-600 font-extrabold py-4 rounded-xl text-xl mb-4 shadow-lg"><i class="fas fa-location-arrow mr-2"></i> נווט עכשיו למקום</a><button onclick="cancelSOS()" class="w-full bg-red-800 text-white font-bold py-3 rounded-xl text-sm">סגור התראה (ביטול)</button></div></div></div>

            const select = document.getElementById('welcome-user-select');
            const groups = Object.entries(families);
            let opts = '<option value="" disabled selected>— בחרו מי אתם —</option>';
            groups.forEach(([gid, g]) => {
                opts += `<optgroup label="${g.title || 'קבוצה'}">` + (g.members||[]).map(m => `<option value="${m}">${m}</option>`).join('') + '</optgroup>';

            select.innerHTML = opts;
            document.getElementById('welcome-modal').style.display = 'block';

        let mediaCache = { gallery: {}, documents: {}, avatars: {} };
        let stateListenerAttached = false;

        function getTripFromUrl(){
            const u = new URL(window.location.href);
            let t = u.searchParams.get('trip');
            if (!t && u.hash){ const m = u.hash.match(/trip=([a-z0-9\-]+)/i); if (m) t = m[1]; }
            return t ? t.toLowerCase().trim() : null;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const t = getTripFromUrl();
            if (t) { loadTrip(t); }
            else { showOnboarding(); }
        });

        function setChromeVisible(v){
            const show = v ? '' : 'none';
            document.getElementById('app-header').style.display = v ? 'block' : 'none';
            document.getElementById('sos-fab').style.display = show;
            const main = document.getElementById('app-content'); if (main) main.style.display = v ? '' : 'none';
        }

        function loadTrip(tripId){
            TRIP_ID = tripId;
            document.getElementById('onboarding').classList.add('hidden');
            document.getElementById('loading-spinner').style.display = 'block';
            const syncEl = document.getElementById('sync-status');
            if (syncEl) syncEl.innerHTML = '<i class="fas fa-sync fa-spin ml-1"></i> טוען טיול...';

            db.ref('trips/' + tripId + '/config').once('value').then(snap => {
                const cfg = snap.val();
                if (!cfg) {
                    // קוד לא קיים — הצע ליצור/להצטרף מחדש
                    document.getElementById('loading-spinner').style.display = 'none';
                    showOnboarding(`הקוד "${tripId}" לא נמצא. בדקו את הקוד או צרו טיול חדש.`);
                    return;
                }
                applyConfig(cfg);
                updateHeaderUserName();
                setChromeVisible(true);
                attachTripListeners();
                // זהות למכשיר
                if (!getMyIdentity()) { changeUserIdentity(); }
            }).catch(err => {
                console.error(err);
                document.getElementById('loading-spinner').style.display = 'none';
                showOnboarding('אירעה שגיאת רשת. נסו שוב.');
            });
        }

        function attachTripListeners(){
            if (stateListenerAttached) return;
            stateListenerAttached = true;

            // מאזין תמונות נפרד (ביצועים) — לא מפיל את שאר האפליקציה
            const mediaHook = (kind) => (snap) => {
                mediaCache[kind] = snap.val() || {};
                appData[kind] = mediaCache[kind];
                if ((kind === 'gallery' && currentView === 'gallery') ||
                    (kind === 'documents' && Object.keys(families).includes(currentView)) ||
                    (kind === 'avatars' && Object.keys(families).includes(currentView))) { renderApp(); }
            };
            mref('gallery').on('value', mediaHook('gallery'));
            mref('documents').on('value', mediaHook('documents'));
            mref('avatars').on('value', mediaHook('avatars'));

            // מאזין מצב ראשי — קליל (בלי תמונות)
            dref('/').on('value', (snapshot) => {
                try {
                    const data = snapshot.val() || {};
                    appData = data;
                    if (data.config) applyConfig(data.config);
                    appData.config = tripConfig;

                    if (!appData.items) appData.items = {};
                    if (!appData.locations) appData.locations = {};
                    if (!appData.wallet) appData.wallet = { expenses: {}, planned: {} };
                    if (!appData.wallet.planned) appData.wallet.planned = {};
                    if (!appData.wallet.expenses) appData.wallet.expenses = {};
                    if (!appData.shopping) appData.shopping = {};
                    if (!appData.pantry) appData.pantry = {};
                    if (!appData.chores) appData.chores = {};
                    if (!appData.checklists) appData.checklists = {};

                    if (!appData.games) appData.games = {};
                    if (!appData.games.scores) appData.games.scores = {};
                    if (!appData.games.individualScores) appData.games.individualScores = {};
                    if (!appData.games.currentCountryCity) appData.games.currentCountryCity = { letter: "?" };
                    if (!appData.games.liveSong) appData.games.liveSong = { word: "?" };
                    if (!appData.games.photoHunt) appData.games.photoHunt = { mission: "לחצו להגרלת משימה ראשונה!" };
                    if (!appData.games.war) appData.games.war = { players: {} };
                    if (!appData.games.taki) appData.games.taki = { center: null };
                    if (!appData.games.duel) appData.games.duel = { current: null };
                    if (!appData.games.riddles) appData.games.riddles = { current: null, showAns: false };
                    if (!appData.games.bingo) appData.games.bingo = { winners: [] };
                    if (!appData.games.whoami) appData.games.whoami = { current: null };

                    if (!appData.emergencyContacts) appData.emergencyContacts = { custom: {} };
                    if (!appData.emergencyContacts.custom) appData.emergencyContacts.custom = {};
                    if (!appData.emergency) appData.emergency = { sos: null, liveLocations: {}, ping: 0 };
                    if (!appData.emergency.liveLocations) appData.emergency.liveLocations = {};

                    // חבר תמונות מהמטמון (המאזין הראשי לא כולל אותן)
                    appData.gallery = mediaCache.gallery;
                    appData.documents = mediaCache.documents;
                    appData.avatars = mediaCache.avatars;

                    // ניקוי אוטומטי במזווה (Anti-Ghost)
                    Object.keys(appData.pantry).forEach(key => {
                        const item = appData.pantry[key];
                        if (!item || !item.name || item.name === "undefined" || String(item.name).trim() === "") {
                            dref(`pantry/${key}`).remove();
                            delete appData.pantry[key];
                        }
                    });

                    // SOS
                    const sos = appData.emergency?.sos;
                    const sosModal = document.getElementById('sos-alert-modal');
                    if (sos && sos.active) {
                        const myName = getMyIdentity();
                        if (sos.timestamp > lastSosTimestamp && sos.sender !== myName) {
                            if (sosModal) sosModal.style.display = 'block';
                            const senderNameEl = document.getElementById('sos-sender-name');
                            if (senderNameEl) senderNameEl.innerText = `מאת: ${sos.sender}`;
                            const navLink = document.getElementById('sos-nav-link');
                            if (navLink) navLink.href = `https://www.google.com/maps/search/?api=1&query=${sos.lat},${sos.lng}`;
                            lastSosTimestamp = sos.timestamp;
                        }
                    } else { if (sosModal) sosModal.style.display = 'none'; }

                    // תיגר
                    const duel = appData.games?.duel?.current;
                    const duelModal = document.getElementById('duel-alert-modal');
                    if (duel && duel.timestamp > lastDuelTimestamp) {
                        const myName = getMyIdentity();
                        lastDuelTimestamp = duel.timestamp;
                        if (duel.challenger !== myName && (duel.target === myName || String(duel.target).includes('כולם') || isMyGroupTargeted(duel.target))) {
                            document.getElementById('duel-challenger').innerText = `${duel.challenger} קרא/ה תיגר על:`;
                            document.getElementById('duel-target').innerText = duel.target;
                            document.getElementById('duel-task').innerText = `"${duel.task}"`;
                            if (duelModal) duelModal.style.display = 'block';
                        }
                    }

                    // מכ"ם
                    const pingTime = appData.emergency.ping || 0;
                    let lastHandledPing = 0;
                    try { lastHandledPing = Number(localStorage.getItem('last_ping_' + TRIP_ID)) || 0; } catch(e){}
                    if (pingTime > lastHandledPing && (Date.now() - pingTime) < 30000) {
                        const myIdentity = getMyIdentity();
                        if (myIdentity && navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition((pos) => {
                                dref(`emergency/liveLocations/${myIdentity}`).set({ lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: firebase.database.ServerValue.TIMESTAMP });

                        }
                        try { localStorage.setItem('last_ping_' + TRIP_ID, pingTime); } catch(e){}
                    }

                    document.getElementById('loading-spinner').style.display = 'none';
                    const syncEl = document.getElementById('sync-status');
                    if (syncEl) syncEl.innerHTML = '<i class="fas fa-cloud text-green-300 ml-1"></i> מחובר · <span class="opacity-80">קוד: ' + TRIP_ID + '</span>';
                    renderScoreboard();
                    renderApp();
                } catch (err) { console.error("Firebase Error:", err); }
            }, (err) => {

        function isMyGroupTargeted(target){

            for (const g of Object.values(families)) { if ((g.members||[]).includes(me) && String(target).includes((g.short||g.title||''))) return true; }

        function renderScoreboard(){
            const el = document.getElementById('total-points-display');
            if (!el) return;
            const scores = (appData.games && appData.games.scores) || {};

                return `<span class="mx-1">${g.short || g.title}: <b>${scores[gid] || 0}</b></span>`;
            });

        }

        // ==========================================
        //  מסך פתיחה + אשף הקמת טיול (המוצר)
        // ==========================================
        function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        let wizGroups = [];

        function showOnboarding(errMsg){

                <div class="w-full max-w-md fade-up">
                    <div class="text-center mb-8">

                        <button onclick="startWizard()" class="w-full bg-gradient-to-l from-indigo-600 to-violet-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg hover:brightness-110 transition flex items-center justify-center gap-2">
                            <i class="fas fa-plus-circle"></i> יצירת טיול חדש
                        </button>
                        <div class="flex items-center gap-3 my-5"><div class="h-px bg-gray-200 flex-1"></div><span class="text-gray-400 text-sm font-bold">או</span><div class="h-px bg-gray-200 flex-1"></div></div>

                            <button onclick="joinTrip()" class="shrink-0 bg-gray-900 text-white font-bold px-5 rounded-[14px] hover:bg-black transition">כניסה</button>

                </div>

        }

        function joinTrip(){
            const v = (document.getElementById('join-code').value || '').toLowerCase().trim().replace(/\s/g,'');
            if (!v) return;
            const u = new URL(window.location.href);
            u.searchParams.set('trip', v); u.hash = '';
            window.location.href = u.toString();
        }

        function startWizard(){
            wizGroups = [{ name: '', membersText: '' }];
            renderWizard();
        }

        function renderWizard(){
            const el = document.getElementById('onboarding');
            el.innerHTML = `
            <div class="aurora"></div>
            <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4" style="padding-top:max(1.25rem,env(safe-area-inset-top))">
                <div class="w-full max-w-lg fade-up">
                    <div class="flex items-center gap-3 mb-4 text-white">
                        <button onclick="showOnboarding()" class="w-10 h-10 rounded-full bg-white/10 border border-white/20 hover:bg-white/20 transition"><i class="fas fa-arrow-right"></i></button>
                        <h2 class="text-2xl font-black">הקמת הטיול שלכם</h2>
                    </div>
                    <div class="bg-white rounded-3xl shadow-2xl p-6 max-h-[82vh] overflow-y-auto hide-scrollbar">
                        <div class="mb-5">
                            <label class="field-label">שם הטיול <span class="text-red-500">*</span></label>
                            <input id="wiz-title" class="field" placeholder="לדוגמה: טיול קרוואנים 2026" oninput="wizAutoCode()">
                        </div>
                        <div class="mb-5">
                            <label class="field-label">כותרת משנה (משפחה / קבוצה)</label>
                            <input id="wiz-sub" class="field" placeholder="לדוגמה: משפחות כהן">
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div><label class="field-label">תאריך יציאה</label><input id="wiz-start" type="date" class="field"></div>
                            <div><label class="field-label">תאריך חזרה</label><input id="wiz-end" type="date" class="field"></div>
                        </div>

                        <div class="flex items-center justify-between mb-2">
                            <label class="field-label !mb-0">קבוצות / משפחות ומשתתפים <span class="text-red-500">*</span></label>
                        </div>
                        <div id="wiz-groups" class="flex flex-col gap-3 mb-3"></div>
                        <button onclick="wizAddGroup()" class="w-full border-2 border-dashed border-indigo-300 text-indigo-600 font-bold py-2.5 rounded-2xl hover:bg-indigo-50 transition mb-6"><i class="fas fa-plus ml-1"></i> הוספת קבוצה</button>

                        <details class="mb-6 rounded-2xl bg-slate-50 border border-slate-200 p-4">
                            <summary class="font-bold text-slate-700 cursor-pointer">קוד הטיול (אפשר להשאיר אוטומטי)</summary>
                            <label class="field-label mt-3">קוד לשיתוף (אותיות/מספרים באנגלית)</label>
                            <input id="wiz-code" dir="ltr" class="field" placeholder="tiyul-1234">
                            <p class="text-xs text-slate-500 mt-2">זה הקוד שתשלחו למשפחה כדי להצטרף. ניתן לשנות.</p>
                        </details>

                        <button onclick="createTrip()" id="wiz-submit" class="w-full bg-gradient-to-l from-indigo-600 to-violet-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg hover:brightness-110 transition">
                            <i class="fas fa-rocket ml-1"></i> יוצרים את הטיול!
                        </button>
                    </div>
                </div>
            </div>`;
            renderWizGroups();
        }

        function renderWizGroups(){
            const box = document.getElementById('wiz-groups'); if(!box) return;
            box.innerHTML = wizGroups.map((g, i) => `
                <div class="rounded-2xl border border-gray-200 p-3 bg-gray-50/60">
                    <div class="flex gap-2 mb-2">
                        <input value="${esc(g.name)}" oninput="wizGroups[${i}].name=this.value" placeholder="שם הקבוצה (למשל: משפחת כהן)" class="field !py-2.5 flex-1">
                        ${wizGroups.length > 1 ? `<button onclick="wizRemoveGroup(${i})" class="shrink-0 w-11 rounded-[14px] bg-red-50 text-red-500 hover:bg-red-100 transition"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                    <textarea oninput="wizGroups[${i}].membersText=this.value" rows="2" placeholder="שמות המשתתפים — כל אחד בשורה או מופרד בפסיק" class="field !py-2.5 text-base">${esc(g.membersText)}</textarea>
                </div>`).join('');
        }
        function wizAddGroup(){ wizGroups.push({ name:'', membersText:'' }); renderWizGroups(); }
        function wizRemoveGroup(i){ wizGroups.splice(i,1); renderWizGroups(); }
        function slugify(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,20); }
        function randCode(){ const c='abcdefghijklmnopqrstuvwxyz0123456789'; let r=''; for(let i=0;i<4;i++) r+=c[Math.floor(Math.random()*c.length)]; return r; }
        function wizAutoCode(){ const codeEl=document.getElementById('wiz-code'); if(codeEl && !codeEl.dataset.touched){ const base=slugify(document.getElementById('wiz-title').value)||'tiyul'; codeEl.value = base + '-' + randCode(); } }

        function parseMembers(text){
            return String(text||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
        }

        function createTrip(){
            const title = (document.getElementById('wiz-title').value||'').trim();
            const sub = (document.getElementById('wiz-sub').value||'').trim();
            const start = document.getElementById('wiz-start').value;
            const end = document.getElementById('wiz-end').value;
            let code = (document.getElementById('wiz-code').value||'').toLowerCase().trim();
            if (!code) code = (slugify(title)||'tiyul') + '-' + randCode();
            code = code.replace(/[^a-z0-9\-]/g,'');

            if (!title) return showModal('חסר שם', 'אנא הזינו שם לטיול.');
            const groups = {};
            let hasMember = false;
            wizGroups.forEach((g, i) => {
                const members = parseMembers(g.membersText);
                if (members.length === 0) return;
                hasMember = true;
                const gid = 'g' + (i+1);
                groups[gid] = { title: g.name.trim() || ('קבוצה ' + (i+1)), short: (g.name.trim().split(' ').pop() || ('קבוצה'+(i+1))), color: GROUP_PALETTE[i % GROUP_PALETTE.length].key, members };
            });
            if (!hasMember) return showModal('חסרים משתתפים', 'הוסיפו לפחות משתתף אחד לקבוצה אחת.');

            const submit = document.getElementById('wiz-submit');
            if (submit){ submit.disabled = true; submit.innerHTML = '<i class="fas fa-spinner fa-spin ml-1"></i> יוצר...'; }

            db.ref('trips/' + code + '/config').once('value').then(snap => {
                if (snap.exists()) {
                    if (submit){ submit.disabled=false; submit.innerHTML='<i class="fas fa-rocket ml-1"></i> יוצרים את הטיול!'; }
                    return showModal('הקוד תפוס', `הקוד "${code}" כבר קיים. בחרו קוד אחר בהגדרות הקוד.`);
                }
                const config = { title, subtitle: sub, startDate: start||'', endDate: end||'', groups, route: [], createdAt: firebase.database.ServerValue.TIMESTAMP };
                const updates = seedInitialData(groups);
                updates['config'] = config;
                updates['isInitialized'] = true;
                db.ref('trips/' + code).update(updates).then(() => {
                    const u = new URL(window.location.href);
                    u.searchParams.set('trip', code); u.hash='';
                    window.location.href = u.toString();
                });
            });
        }

        // נתוני זרע כלליים (ללא נתוני לקוח) לטיול חדש
        function seedInitialData(groups){
            const updates = {};
            updates['chores'] = [ { name:"שטיפת כלים", assignee:"" }, { name:"הכנת ארוחת בוקר", assignee:"" }, { name:"סידור וניקיון", assignee:"" } ];
            updates['checklists/departure'] = [ { task:"בדיקת מים/דלק/גז", done:false }, { task:"סגירת חלונות ונעילה", done:false }, { task:"קיבוע ציוד שלא יזוז בנסיעה", done:false } ];
            updates['checklists/arrival'] = [ { task:"ייצוב וחניה", done:false }, { task:"חיבור לחשמל/מים", done:false }, { task:"פתיחת סככה וסידור", done:false } ];
            Object.values(groups).forEach(g => (g.members||[]).forEach(person => {
                const obj = {};
                [ { category:"ביגוד", name:"חולצות", amount:"7", note:"" }, { category:"ביגוד", name:"מכנסיים", amount:"4", note:"" }, { category:"טואלטיקה", name:"מברשת שיניים", amount:"1", note:"" } ]
                    .forEach((it, idx) => { obj['seed_' + idx] = { ...it, packed:false }; });
                updates['items/' + person] = obj;
            }));
            return updates;
        }

        // ==========================================
        //  ניהול טיול — שיתוף / הגדרות / מעבר
        // ==========================================
        function tripUrl(){ const u = new URL(window.location.href); u.hash=''; u.search=''; u.searchParams.set('trip', TRIP_ID); return u.toString(); }
        function openTripMenu(){ const sub=document.getElementById('trip-menu-sub'); if(sub) sub.innerText = (tripConfig?.title||'') + ' · קוד: ' + TRIP_ID; document.getElementById('trip-menu-modal').style.display='block'; }
        function shareTrip(){
            const url = tripUrl();
            const text = `הצטרפו לטיול "${tripConfig?.title||''}" באפליקציה 🧭\nקוד: ${TRIP_ID}\n${url}`;
            document.getElementById('trip-menu-modal').style.display='none';
            if (navigator.share) { navigator.share({ title: tripConfig?.title||'טיול', text, url }).catch(()=>{}); }
            else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(()=> showModal('הקישור הועתק!', `שלחו למשפחה בוואטסאפ:<br><br><b dir="ltr">${url}</b><br><br>או הקוד: <b>${TRIP_ID}</b>`)); }
            else { showModal('קוד הטיול', `קוד: <b>${TRIP_ID}</b><br><span dir="ltr">${url}</span>`); }
        }
        function leaveTrip(){ const u=new URL(window.location.href); u.search=''; u.hash=''; window.location.href=u.toString(); }
        function openTripSettings(){ document.getElementById('trip-menu-modal').style.display='none'; navigate('settings'); }

        // ==========================================
        //  עזרים וחלונות קופצים
        // ==========================================
        function showModal(title, message, showCancel = false, onOk = null) {
            const titleEl = document.getElementById('modal-title');
            if(titleEl) titleEl.innerText = title; 
            const msgEl = document.getElementById('modal-message');
            if(msgEl) msgEl.innerHTML = message; 
            
            const modal = document.getElementById('custom-modal'); 
            const cancelBtn = document.getElementById('modal-cancel-btn'); 
            const okBtn = document.getElementById('modal-ok-btn'); 
            if(!modal || !cancelBtn || !okBtn) return;
            
            cancelBtn.style.display = showCancel ? 'block' : 'none'; 
            
            const newOkBtn = okBtn.cloneNode(true); 
            okBtn.parentNode.replaceChild(newOkBtn, okBtn); 
            const newCancelBtn = cancelBtn.cloneNode(true); 
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn); 
            
            modal.style.display = 'block'; 
            
            const close = () => { modal.style.display = 'none'; }; 
            newOkBtn.onclick = () => { close(); if (onOk) onOk(); }; 
            newCancelBtn.onclick = close; 
        }

        // פעולות מצוקה ומכ"ם
        function triggerSOS() { 
            const myName = getMyIdentity(); 
            if (!myName) { changeUserIdentity(); return; } 
            if (navigator.geolocation) { 
                showModal('משדר מצוקה...', '<i class="fas fa-satellite-dish fa-spin text-3xl text-red-500 mb-2"></i><br>מאתר מיקום...', false); 
                navigator.geolocation.getCurrentPosition((pos) => { 
                    dref('emergency/sos').set({ active: true, sender: myName, lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: firebase.database.ServerValue.TIMESTAMP }).then(() => { 
                        showModal('המצוקה שודרה!', 'כל המשפחה קיבלה התראה!', false, () => { 
                            setTimeout(() => { showModal('ביטול אזעקה', 'לכבות?', true, cancelSOS); }, 500); 
                        }); 
                    }); 
                }, (err) => { showModal('שגיאת GPS', 'לא מצאנו מיקום.'); }, { enableHighAccuracy: true, timeout: 10000 }); 
            } else { showModal('שגיאה', 'אין GPS במכשיר.'); } 
        }
        function cancelSOS() { dref('emergency/sos/active').set(false); const sosModal = document.getElementById('sos-alert-modal'); if (sosModal) sosModal.style.display = 'none'; }
        function pingEveryone() { showModal('מפעיל מכ"ם...', 'שולח פקודה למכשירים...', false); dref('emergency/ping').set(firebase.database.ServerValue.TIMESTAMP).then(() => { setTimeout(() => { const customModal = document.getElementById('custom-modal'); if(customModal) customModal.style.display = 'none'; }, 2000); }); }
        function updateMyLiveLocation() { 
            const myName = getMyIdentity(); 
            if (!myName) { changeUserIdentity(); return; } 
            if (navigator.geolocation) { 
                showModal('מעדכן מיקום...', 'מחפש...', false); 
                navigator.geolocation.getCurrentPosition((pos) => { 
                    dref(`emergency/liveLocations/${myName}`).set({ lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: firebase.database.ServerValue.TIMESTAMP }).then(() => { 
                        const customModal = document.getElementById('custom-modal'); if(customModal) customModal.style.display = 'none'; 
                    }); 
                }, () => { showModal('שגיאה', 'לא ניתן לקרוא מיקום.'); }, { enableHighAccuracy: true });
            }
        }

        // ==========================================
        //  מוקד חירום, איתור ומכ"ם  (renderEmergency — היה חסר!)
        // ==========================================
        function timeAgo(ts){ if(!ts) return ''; const s = Math.max(0, Math.round((Date.now()-ts)/1000)); if(s<60) return 'לפני שניות'; const m=Math.round(s/60); if(m<60) return `לפני ${m} דק'`; const h=Math.round(m/60); return `לפני ${h} שע'`; }

        function renderEmergency(content){
            const live = (appData.emergency && appData.emergency.liveLocations) || {};
            const custom = (appData.emergencyContacts && appData.emergencyContacts.custom) || {};
            const preset = [
                { name: 'חירום כללי (אירופה)', num: '112', icon: 'fa-triangle-exclamation' },

            } else {
                liveHtml = liveKeys.map(name => {
                    const l = live[name];
                    return `<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center"><i class="fas fa-location-dot"></i></div>
                        <div><p class="font-extrabold text-gray-800">${esc(name)}</p><p class="text-xs text-gray-400">${timeAgo(l.timestamp)}</p></div></div>
                        <a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank" class="bg-gray-900 hover:bg-black text-white px-4 py-2.5 rounded-xl font-bold shadow transition text-sm"><i class="fas fa-diamond-turn-right ml-1"></i> נווט</a>
                    </div>`;
                }).join('');
            }

            let contactsHtml = preset.map(c => `
                <a href="tel:${c.num}" class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hover:border-red-200 transition">
                    <div class="flex items-center gap-3"><div class="w-10 h-10 bg-red-100 text-red-600 rounded-full flex items-center justify-center"><i class="fas ${c.icon}"></i></div><span class="font-bold text-gray-800">${c.name}</span></div>
                    <span class="font-black text-red-600 text-lg" dir="ltr">${c.num}</span>
                </a>`).join('');
            contactsHtml += Object.entries(custom).map(([k,c]) => `
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <a href="tel:${esc(c.num)}" class="flex items-center gap-3 flex-1"><div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center"><i class="fas fa-user"></i></div><div><p class="font-bold text-gray-800">${esc(c.name)}</p><p class="text-sm text-indigo-600 font-bold" dir="ltr">${esc(c.num)}</p></div></a>
                    <button onclick="deleteContact('${k}')" class="text-red-300 hover:text-red-500 p-2"><i class="fas fa-trash"></i></button>
                </div>`).join('');

            content.innerHTML = `
                <div class="text-center mb-6 mt-2">
                    <h2 class="text-3xl font-extrabold text-gray-800"><i class="fas fa-life-ring text-red-500 ml-2"></i> מוקד חירום ואיתור</h2>
                    <p class="text-gray-500 mt-2">מכ״ם משפחתי, שיתוף מיקום חי ומספרי חירום</p>
                </div>

                <div class="grid grid-cols-1 gap-3 mb-8">
                    <button onclick="triggerSOS()" class="bg-gradient-to-l from-red-600 to-rose-600 text-white rounded-3xl p-5 shadow-lg flex items-center gap-4 text-right hover:brightness-110 transition">
                        <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center text-2xl shrink-0"><i class="fas fa-bullhorn"></i></div>
                        <div><h3 class="font-black text-xl">שגר קריאת מצוקה</h3><p class="text-red-100 text-sm">כל המשפחה תקבל התראה + המיקום המדויק שלך</p></div>
                    </button>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="pingEveryone()" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col items-center gap-2 hover:border-indigo-200 transition">
                            <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-xl"><i class="fas fa-satellite-dish"></i></div>
                            <span class="font-bold text-gray-800">הפעל מכ״ם</span><span class="text-xs text-gray-400">בקש מכולם לשדר מיקום</span>

        function saveTripDetails(){ const u={ title:(document.getElementById('set-title').value||'').trim(), subtitle:(document.getElementById('set-sub').value||'').trim(), startDate:document.getElementById('set-start').value||'', endDate:document.getElementById('set-end').value||'' }; dref('config').update(u).then(()=>showModal('נשמר','פרטי הטיול עודכנו לכולם.')); }
        function renameGroup(gid, val){ dref('config/groups/'+gid+'/title').set((val||'').trim() || 'קבוצה'); }
        function removeGroup(gid){ if(Object.keys(families).length<=1) return showModal('אי אפשר','חייבת להישאר לפחות קבוצה אחת.'); showModal('מחיקת קבוצה','למחוק את הקבוצה וכל המשתתפים בה מההגדרות? (הנתונים הקיימים יישארו)',true,()=> dref('config/groups/'+gid).remove()); }
        function addGroupSetting(){ const gid='g'+(Date.now().toString(36)); dref('config/groups/'+gid).set({ title:'קבוצה חדשה', short:'קבוצה', color:'indigo', members:[] }); }
        function addMember(gid){ const el=document.getElementById('addm-'+gid); const name=(el.value||'').trim(); if(!name) return; const members=(families[gid].members||[]).slice(); members.push(name); dref('config/groups/'+gid+'/members').set(members); }
        function removeMember(gid, idx){ const members=(families[gid].members||[]).slice(); members.splice(idx,1); dref('config/groups/'+gid+'/members').set(members); }
        function addRoutePoint(){ const name=(document.getElementById('rp-name').value||'').trim(); const lat=parseFloat(document.getElementById('rp-lat').value); const lng=parseFloat(document.getElementById('rp-lng').value); const icon=(document.getElementById('rp-icon').value||'📍').trim(); if(!name||isNaN(lat)||isNaN(lng)) return showModal('חסר מידע','מלאו שם + קו רוחב + קו אורך תקינים.'); const route=(tripConfig.route||[]).slice(); route.push({name, lat, lng, icon, desc:''}); dref('config/route').set(route); }
        function removeRoutePoint(i){ const route=(tripConfig.route||[]).slice(); route.splice(i,1); dref('config/route').set(route); }

        // ==========================================
        //  ניהול הניווט (כולל חץ אחורה)
        // ==========================================
        function navigate(view, group = null, game = null) {
            if (view === 'dashboard') {
                viewHistory = []; 
            } else if (view !== currentView || game !== currentGame || group !== currentGroup) {
                viewHistory.push({ view: currentView, group: currentGroup, tab: currentTab, game: currentGame });
            }
            
            currentView = view; 
            currentGame = game; 
            if (group && families[group]) {
                currentGroup = group;
                currentTab = (families[group].members && families[group].members[0]) || null;
            }
            renderApp(); 
        }
        
        function goBack() {
            if (viewHistory.length > 0) {
                const prev = viewHistory.pop();
                currentView = prev.view;
                currentGroup = prev.group;
                currentTab = prev.tab;
                currentGame = prev.game;
            } else {
                currentView = 'dashboard';
            }
            renderApp();
        }
        
        function renderApp() {
            const content = document.getElementById('app-content'); 
            if(!content) return;

            const tabsContainer = document.getElementById('tabs-container'); 
            const backBtn = document.getElementById('back-btn'); 
            const homeBtn = document.getElementById('home-btn'); 
            const progressContainer = document.getElementById('progress-container'); 
            const totalPoints = document.getElementById('total-points-display'); 
            const spinner = document.getElementById('loading-spinner');
            
            if (spinner) spinner.style.display = 'none';
            
            try {
                if (currentView === 'dashboard') { 
                    if(backBtn) backBtn.classList.add('hidden'); 
                    if(homeBtn) homeBtn.classList.add('hidden'); 
                    if(tabsContainer) tabsContainer.classList.add('hidden'); 
                    if(progressContainer) progressContainer.classList.add('hidden'); 
                    if(totalPoints) totalPoints.classList.add('hidden'); 
                    renderDashboard(content); 
                }
                else if (currentView === 'games_console') { 
                    if(backBtn) backBtn.classList.remove('hidden'); 
                    if(homeBtn) homeBtn.classList.remove('hidden'); 
                    if(tabsContainer) tabsContainer.classList.add('hidden'); 
                    if(progressContainer) progressContainer.classList.add('hidden'); 
                    if(totalPoints) totalPoints.classList.remove('hidden'); 
                    
                    if(!currentGame) renderGamesMenu(content); 
                    else if(currentGame === 'speed_taki') renderSpeedTaki(content);
                    else if(currentGame === 'duel') renderDuel(content);
                    else if(currentGame === 'riddles') renderRiddles(content);
                    else if(currentGame === 'bingo') renderBingo(content);
                    else if(currentGame === 'whoami') renderWhoAmI(content);
                    else if(currentGame === 'war') renderCardWar(content);
                    else if(currentGame === 'photo_hunt') renderPhotoHunt(content);
                    else if(currentGame === 'trivia') renderTrivia(content);
                    else if(currentGame === 'country_city') renderCountryCity(content);
                    else if(currentGame === 'songs') renderLiveSong(content);
                }
                else {
                    if(backBtn) backBtn.classList.remove('hidden'); 
                    if(homeBtn) homeBtn.classList.remove('hidden'); 
                    if(totalPoints) totalPoints.classList.add('hidden');
                    
                    if (Object.keys(families).includes(currentView)) {
                        if(tabsContainer) tabsContainer.classList.remove('hidden');
                        if(progressContainer) progressContainer.classList.remove('hidden');
                        renderTabs(); renderContent(content); updateGroupProgress();
                    }
                    else {
                        if(tabsContainer) tabsContainer.classList.add('hidden');
                        if(progressContainer) progressContainer.classList.add('hidden');

                        if (currentView === 'caravan') renderCaravan(content);
                        else if (currentView === 'wallet') renderWallet(content);
                        else if (currentView === 'map') renderMap(content);
                        else if (currentView === 'emergency') renderEmergency(content);
                        else if (currentView === 'chores') renderChores(content);
                        else if (currentView === 'pantry') renderPantry(content);
                        else if (currentView === 'gallery') renderGallery(content);
                        else if (currentView === 'settings') renderSettings(content);
                    }
                }
            } catch(e) { console.error("Render Error: ", e); }
            window.scrollTo(0,0);
        }

        // ==========================================
        //  מסך הבית (Dashboard) - הנה התיקון לכפתורים!
        // ==========================================
        function tripCountdown(){
            try {
                const s = tripConfig && tripConfig.startDate; if(!s) return null;
                const today = new Date(); today.setHours(0,0,0,0);
                const start = new Date(s + 'T00:00:00');
                const diff = Math.round((start - today) / 86400000);
                if (diff > 1) return `עוד ${diff} ימים ליציאה`;
                if (diff === 1) return 'מחר יוצאים!';
                if (diff === 0) return 'היום יוצאים לדרך! 🚐';
                const end = tripConfig.endDate ? new Date(tripConfig.endDate + 'T00:00:00') : null;
                if (end && today <= end) return 'הטיול בעיצומו — טיול נעים! 🏕️';
                return 'הטיול הסתיים — תודה על הזכרונות 💛';
            } catch(e){ return null; }
        }

        function addShoppingItem() { 
            const n = document.getElementById('new-shop-item').value.trim(); 
            const q = document.getElementById('new-shop-qty').value.trim() || '1'; 
            const a = document.getElementById('new-shop-assignee').value; 
            const l = document.getElementById('new-shop-location').value; 
            if(n) { 
                dref('shopping').push({ name: n, qty: q, assignee: a, location: l }); 
                document.getElementById('new-shop-item').value = '';
            } else { 
                showModal('שגיאה', 'אנא הזן שם מוצר לטובת הקנייה.'); 
            } 
        }
        
        function deleteShoppingItem(key) { dref(`shopping/${key}`).remove(); }

        // קופה רושמת חכמה (למזווה + ארנק)
        function openCheckoutFromShopping(key) { 
            const item = appData.shopping[key]; 
            if(!item) return; 
            pendingCheckout = { source: 'shopping', key: key, name: item.name, qty: item.qty || '1', assignee: item.assignee };
            showCheckoutUI();
        }

        function openCheckoutDirect() {
            const name = document.getElementById('new-shop-item').value.trim();
            const qty = document.getElementById('new-shop-qty').value.trim() || '1';
            const assignee = document.getElementById('new-shop-assignee').value;
            
            if(!name) return showModal('שגיאה', 'אנא הזן את שם המוצר.');
            pendingCheckout = { source: 'direct', key: null, name: name, qty: qty, assignee: assignee };
            showCheckoutUI();
        }

        function showCheckoutUI() {
            const nameEl = document.getElementById('buy-item-name');
            if(nameEl) nameEl.innerText = `${pendingCheckout.name} (${pendingCheckout.qty})`; 
            
            const payerSelect = document.getElementById('buy-item-payer');
            if (payerSelect) {
                payerSelect.innerHTML = Object.entries(families).map(([gid,g]) => `<option value="${gid}">${esc(g.title)}</option>`).join('');
                // ברירת מחדל: הקבוצה ששויכה למוצר (אם יש)
                const match = Object.entries(families).find(([gid,g]) => g.title === pendingCheckout.assignee);
                if (match) payerSelect.value = match[0];
            }
            
            const costEl = document.getElementById('buy-item-cost');
            if(costEl) costEl.value = ''; 
            
            const toggle = document.getElementById('sync-wallet-toggle');
            if (toggle) toggle.checked = true;
            
            const fields = document.getElementById('buy-cost-fields');
            if (fields) {
                fields.style.opacity = '1';
                fields.style.pointerEvents = 'auto';
            }

            const buyModal = document.getElementById('buy-modal');
            if(buyModal) buyModal.style.display = 'block'; 
        }
        
        function confirmBuyAndSync() { 
            if(!pendingCheckout) return; 
            
            const isSync = document.getElementById('sync-wallet-toggle').checked; 
            const cost = document.getElementById('buy-item-cost').value; 
            const payer = document.getElementById('buy-item-payer').value; 
            
            if (isSync && (!cost || cost <= 0)) { 
                showModal('שגיאה', 'יש להזין מחיר (₪) גדול מ-0 כדי לסנכרן לארנק, או לכבות את הסנכרון.'); 
                return; 
            } 
            
            let linkedExpenseId = null;
            if (isSync) { 
                const newExpenseRef = dref(`wallet/expenses`).push();
                linkedExpenseId = newExpenseRef.key;
                newExpenseRef.set({ 
                    description: `סופר: ${pendingCheckout.name}`, 
                    amount: Number(cost), 
                    paidBy: payer, 
                    timestamp: firebase.database.ServerValue.TIMESTAMP 
                }); 
            } 
            
            dref('pantry').push({ 
                name: pendingCheckout.name, 
                qty: pendingCheckout.qty, 
                used: false,
                linkedExpenseId: linkedExpenseId 
            }); 
            
            if (pendingCheckout.source === 'shopping') {
                dref(`shopping/${pendingCheckout.key}`).remove(); 
            } else {
                document.getElementById('new-shop-item').value = '';
                document.getElementById('new-shop-qty').value = '';
            }

            const buyModal = document.getElementById('buy-modal');
            if(buyModal) buyModal.style.display = 'none'; 
            pendingCheckout = null; 
        }
        
        function changePantryQty(key, diff) { 
            const item = appData.pantry[key]; 
            if (!item) return; 
            let newQty = parseInt(item.qty) + diff; 
            if (isNaN(newQty)) newQty = 1; 
            
            if (newQty <= 0) { 
                dref(`pantry/${key}`).update({ qty: 0, used: true }); 
            } else { 
                dref(`pantry/${key}`).update({ qty: newQty, used: false }); 
            } 
        }
        
        function deletePantryItem(key) { 
            const item = appData.pantry[key]; 
            if(!item) return;
            
            let msg = `האם למחוק את הפריט '${item.name || ''}' לגמרי מהמזווה?`;
            
            if (item.linkedExpenseId && appData.wallet && appData.wallet.expenses && appData.wallet.expenses[item.linkedExpenseId]) {
                msg += `<br><br><span class='text-red-500 font-bold'>* שימו לב: מחיקה זו תבטל גם את ההוצאה הכספית (₪) שנרשמה בארנק המשותף!</span>`;
            }

            showModal('מחיקה מוחלטת', msg, true, () => { 
                dref(`pantry/${key}`).remove(); 
                if (item.linkedExpenseId) {
                    dref(`wallet/expenses/${item.linkedExpenseId}`).remove();
                }
            }); 
        }

        function payerLabel(v){ return (families[v] && (families[v].short || families[v].title)) || v; }
        function renderWallet(content) {
            const expenses = appData.wallet.expenses || {};
            const gids = Object.keys(families);
            const byGroup = {}; gids.forEach(g => byGroup[g] = 0);
            let total = 0;
            Object.values(expenses).forEach(exp => { const amt = Number(exp.amount)||0; total += amt; if (byGroup[exp.paidBy] !== undefined) byGroup[exp.paidBy] += amt; });
            const fair = gids.length ? total / gids.length : 0;

            // התחשבנות: מי מעל/מתחת לחלק ההוגן
            const nets = gids.map(g => ({ g, net: byGroup[g] - fair }));
            let settleHtml = '<span class="text-green-600">הכל מאוזן — אין חובות! 🎉</span>';

                const rows = nets.filter(n => Math.abs(n.net) > 0.5)
                    .sort((a,b)=>a.net-b.net)
                    .map(n => n.net < 0
                        ? `<div class="text-red-500">${payerLabel(n.g)} צריכים לשלם ₪${Math.abs(n.net).toFixed(0)}</div>`
                        : `<div class="text-green-600">${payerLabel(n.g)} אמורים לקבל ₪${n.net.toFixed(0)}</div>`);

                </div>

                <div class="bg-indigo-50 rounded-3xl shadow-sm border border-indigo-100 p-5 mb-8">
