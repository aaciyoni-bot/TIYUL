<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>טיול קרוואנים 2026 - משפחות פרידמן</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .avatar-container { position: relative; display: inline-block; cursor: pointer; transition: transform 0.2s; }
        .avatar-container:hover { transform: scale(1.05); }
        .avatar-img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid #4f46e5; background-color: #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .avatar-edit-btn { position: absolute; bottom: 0; right: 0; background-color: #4f46e5; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; }
        .doc-card { transition: all 0.2s ease; }
        .doc-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .check-toggle { transition: all 0.3s; }
        .check-toggle.active { background-color: #10b981; border-color: #10b981; }
        .packed-text { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 select-none">

    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold"><i class="fas fa-caravan mr-2"></i> קרוואנים 2026</h1>
            <div class="flex gap-2">
                <button id="home-btn" onclick="goHome()" class="hidden text-xs bg-indigo-500 hover:bg-indigo-600 px-3 py-1.5 rounded-full font-bold transition shadow"><i class="fas fa-home mr-1"></i> ראשי</button>
                <button onclick="exportToExcel()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition shadow" title="ייצוא לאקסל"><i class="fas fa-file-excel"></i></button>
            </div>
        </div>
        <div class="flex justify-between items-center text-sm mb-1 mt-3">
            <span id="sync-status" class="text-blue-200"><i class="fas fa-sync fa-spin mr-1"></i> מתחבר לענן...</span>
            <span id="total-progress-text" class="font-bold">אריזה כללית: 0%</span>
        </div>
        <div class="w-full bg-indigo-900 rounded-full h-2.5 shadow-inner">
            <div id="total-progress-bar" class="bg-green-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
    </header>

    <div id="dashboard-screen" class="p-4 max-w-3xl mx-auto hidden">
        <div class="text-center mb-6 mt-2">
            <h2 class="text-2xl font-black text-gray-800">לאן הולכים עכשיו?</h2>
            <p class="text-gray-500 text-sm">בחרו את האזור שתרצו לנהל</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <button onclick="openModule('mishmar')" class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-indigo-500 hover:bg-indigo-50 transition text-center group flex flex-col items-center">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mb-3 group-hover:scale-110 transition"><i class="fas fa-backpack"></i></div>
                <h3 class="font-bold text-gray-800">ציוד: פרידמן-משמר</h3>
            </button>
            <button onclick="openModule('adora')" class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-blue-500 hover:bg-blue-50 transition text-center group flex flex-col items-center">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl mb-3 group-hover:scale-110 transition"><i class="fas fa-suitcase-rolling"></i></div>
                <h3 class="font-bold text-gray-800">ציוד: פרידמן-אדורה</h3>
            </button>
        </div>

        <button onclick="openModule('shared_equip')" class="w-full bg-white p-5 rounded-2xl shadow-sm border-b-4 border-emerald-500 hover:bg-emerald-50 transition text-center group flex items-center justify-center gap-4 mb-8">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl group-hover:scale-110 transition"><i class="fas fa-boxes"></i></div>
            <h3 class="font-bold text-gray-800 text-lg">ציוד כללי ומשותף</h3>
        </button>

        <h3 class="font-bold text-gray-600 mb-3 px-2 text-sm uppercase tracking-wider">כלים וניהול מסע</h3>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="openModule('caravan')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:bg-gray-50 flex items-center gap-3">
                <div class="text-green-500 text-2xl"><i class="fas fa-steering-wheel"></i></div>
                <div class="text-right"><p class="font-bold text-sm text-gray-800">ניהול קרוואן</p><p class="text-xs text-gray-500">צ'קליסטים</p></div>
            </button>
            <button onclick="openModule('map')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:bg-gray-50 flex items-center gap-3">
                <div class="text-red-500 text-2xl"><i class="fas fa-map-marked-alt"></i></div>
                <div class="text-right"><p class="font-bold text-sm text-gray-800">מפת מסלול</p><p class="text-xs text-gray-500">ניווט ליעדים</p></div>
            </button>
            <button onclick="openModule('wallet')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:bg-gray-50 flex items-center gap-3">
                <div class="text-indigo-500 text-2xl"><i class="fas fa-wallet"></i></div>
                <div class="text-right"><p class="font-bold text-sm text-gray-800">ארנק משותף</p><p class="text-xs text-gray-500">תכנון והתקזזות</p></div>
            </button>
            <button onclick="openModule('chores')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:bg-gray-50 flex items-center gap-3">
                <div class="text-purple-500 text-2xl"><i class="fas fa-dice"></i></div>
                <div class="text-right"><p class="font-bold text-sm text-gray-800">תורנויות</p><p class="text-xs text-gray-500">מי שוטף כלים?</p></div>
            </button>
        </div>

        <button onclick="openModule('games')" class="w-full mt-3 bg-gradient-to-r from-orange-400 to-pink-500 p-4 rounded-xl shadow-md text-white flex items-center justify-center gap-3 hover:opacity-90 transition transform hover:scale-105 active:scale-95">
            <i class="fas fa-gamepad text-3xl animate-pulse"></i>
            <div class="text-right"><p class="font-black text-lg">משחקי הדרך</p><p class="text-xs text-orange-100">טריוויה לייב: משמר VS אדורה!</p></div>
        </button>
    </div>

    <nav id="tabs-container" class="hidden overflow-x-auto hide-scrollbar bg-white shadow-sm border-b z-10 sticky top-[90px] px-2 py-1 flex"></nav>

    <main id="app-content" class="p-4 max-w-3xl mx-auto">
        <div class="text-center mt-20" id="loading-spinner">
            <i class="fas fa-spinner fa-spin text-5xl text-indigo-500"></i>
            <p class="mt-4 text-gray-600 font-medium text-lg" id="loading-text">טוען נתונים מהענן...</p>
        </div>
    </main>

    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 transform transition-all">
            <h3 id="modal-title" class="text-xl font-bold mb-3 text-gray-800"></h3>
            <p id="modal-message" class="text-gray-600 mb-6 text-lg"></p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel-btn" class="px-5 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg hidden font-medium transition">ביטול</button>
                <button id="modal-ok-btn" class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold shadow-md transition">אישור</button>
            </div>
        </div>
    </div>

    <div id="image-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
        <button onclick="closeImageModal()" class="absolute top-4 right-4 text-white text-3xl hover:text-gray-300"><i class="fas fa-times"></i></button>
        <img id="full-screen-img" src="" alt="Document" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl object-contain">
        <div class="mt-6 flex gap-4">
             <button id="delete-doc-btn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-bold shadow-lg transition"><i class="fas fa-trash mr-2"></i>מחק מסמך</button>
             <button onclick="closeImageModal()" class="bg-white hover:bg-gray-100 text-gray-800 px-6 py-2 rounded-full font-bold shadow-lg transition">סגור חלון</button>
        </div>
    </div>

    <input type="file" id="doc-upload-input" class="hidden" accept="image/*" onchange="handleDocumentUpload(event)">
    <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="handleAvatarUpload(event)">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYd3UQO4d1OQN23quXTwMj1WK2wq0chX4",
            authDomain: "tiyul-f886a.firebaseapp.com",
            projectId: "tiyul-f886a",
            storageBucket: "tiyul-f886a.firebasestorage.app",
            messagingSenderId: "644534839473",
            appId: "1:644534839473:web:f7632f361d24183e161a90",
            measurementId: "G-D54PY1YFPQ",
            databaseURL: "https://tiyul-f886a-default-rtdb.europe-west1.firebasedatabase.app" 
        };

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        } catch (e) {
            document.getElementById('loading-text').innerText = "שגיאה באתחול: " + e.message;
        }

        const db = firebase.database();

        const groups = {
            mishmar: ["יוני", "חנה", "ליאור", "אייל", "הילה", "יובל", "ציוד כללי פרידמן משמר"],
            adora: ["עוזיאל", "שרונה", "להבה", "אליה", "דביר", "הלל", "ציוד כללי פרידמן אדורה"],
            shared_equip: ["ציוד כללי משותף"]
        };
        const allPeople = [...groups.mishmar, ...groups.adora, ...groups.shared_equip];
        const activeFamilyMembers = [...groups.mishmar.slice(0,6), ...groups.adora.slice(0,6)];
        const adults = ["יוני", "חנה", "עוזיאל", "שרונה"];

        let appData = { items: {}, avatars: {}, documents: {}, wallet: { expenses: {}, planned: {} }, checklists: {}, chores: {}, locations: {}, games: { triviaScores: {} } };
        let currentTab = '';
        let activeTabGroup = [];
        let currentUploadDocType = "";
        let isUploadingCustomDoc = false;

        const syncStatus = document.getElementById('sync-status');
        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData.items = data.items || {};
                appData.avatars = data.avatars || {};
                appData.documents = data.documents || {};
                appData.wallet = data.wallet || { expenses: {}, planned: {} };
                if (!appData.wallet.planned) appData.wallet.planned = {};
                if (!appData.wallet.expenses) appData.wallet.expenses = {};
                appData.checklists = data.checklists || { departure: [], arrival: [] };
                appData.chores = data.chores || {};
                appData.locations = data.locations || {};
                appData.games = data.games || { triviaScores: {} };
            }
            
            generateInitialData();
            syncStatus.innerHTML = '<i class="fas fa-cloud-check text-green-300 mr-1"></i> מסונכרן';
            
            updateTotalProgress();
            
            if(document.getElementById('loading-spinner')) {
                // First load complete
                document.getElementById('loading-spinner').remove();
                goHome(); // Show dashboard
            } else if(currentTab !== '') {
                renderApp(); // Re-render current open module if updating live
            }
        }, (error) => {
            syncStatus.innerHTML = '<i class="fas fa-exclamation-triangle text-red-300 mr-1"></i> שגיאת חיבור';
            console.error(error);
        });

        function showModal(title, message, showCancel = false, onOk = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const modal = document.getElementById('custom-modal');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            const okBtn = document.getElementById('modal-ok-btn');
            
            cancelBtn.style.display = showCancel ? 'block' : 'none';
            
            const newOkBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            const newCancelBtn = cancelBtn.cloneNode(true);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newOkBtn.onclick = () => { modal.classList.add('hidden'); if (onOk) onOk(); };
            newCancelBtn.onclick = () => modal.classList.add('hidden');
            modal.classList.remove('hidden');
        }

        function openModule(moduleName) {
            document.getElementById('dashboard-screen').classList.add('hidden');
            const tabsContainer = document.getElementById('tabs-container');
            document.getElementById('home-btn').classList.remove('hidden');

            if (groups[moduleName]) {
                activeTabGroup = groups[moduleName];
                currentTab = activeTabGroup[0];
                tabsContainer.classList.remove('hidden');
            } else {
                activeTabGroup = [];
                currentTab = moduleName; // e.g. 'caravan', 'wallet'
                tabsContainer.classList.add('hidden');
            }
            renderApp();
        }

        function goHome() {
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('tabs-container').classList.add('hidden');
            document.getElementById('app-content').innerHTML = '';
            document.getElementById('home-btn').classList.add('hidden');
            currentTab = '';
            activeTabGroup = [];
        }

        function renderApp() {
            if(activeTabGroup.length > 0) renderTabs();
            
            if (currentTab === 'caravan') renderCaravan();
            else if (currentTab === 'wallet') renderWallet();
            else if (currentTab === 'chores') renderChores();
            else if (currentTab === 'map') renderMap();
            else if (currentTab === 'games') renderGames();
            else if (currentTab !== '') renderContent(); // Equipment lists
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            activeTabGroup.forEach(person => {
                const isActive = person === currentTab;
                let total = 0, packed = 0;
                
                if(appData.items[person]) {
                    Object.values(appData.items[person]).forEach(item => {
                        total++; if(item.packed) packed++;
                    });
                }
                
                const isDone = (packed === total && total > 0);
                const btn = document.createElement('button');
                btn.className = `px-5 py-3 whitespace-nowrap text-sm flex-shrink-0 transition-colors border-b-2 ${isActive ? 'border-indigo-600 text-indigo-700 font-bold bg-indigo-50/50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`;
                btn.innerHTML = `
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-base">${person}</span>
                        ${total > 0 ? `<span class="text-xs bg-white border border-gray-200 px-2 py-0.5 rounded-full shadow-sm ${isDone ? 'text-green-500 font-bold' : 'text-gray-500'}">${isDone ? '<i class="fas fa-check mr-1"></i>' : ''}${packed}/${total}</span>` : ''}
                    </div>
                `;
                btn.onclick = () => { currentTab = person; renderApp(); };
                container.appendChild(btn);
            });
        }

        const triviaQuestions = [
            { q: "מי בדרך כלל לוקח הכי הרבה זמן להתארגן בבוקר?", options: ["יוני", "עוזיאל", "הילה", "להבה"], a: 2 },
            { q: "איך אומרים 'תודה' באיטלקית?", options: ["גרסיאס", "גרציה", "מרסי", "דנקה"], a: 1 },
            { q: "מה הגובה של המון בלאן (ההר הכי גבוה באלפים)?", options: ["4,809 מטר", "3,500 מטר", "5,200 מטר", "8,848 מטר"], a: 0 },
            { q: "כמה רגליים יש לעכביש?", options: ["6", "8", "10", "12"], a: 1 },
            { q: "איזה מאכל איטלקי אהוב במיוחד על דביר ואייל?", options: ["פיצה", "לזניה", "רביולי", "ניוקי"], a: 0 },
            { q: "מה עיר הבירה של אוסטריה?", options: ["זלצבורג", "אינסברוק", "וינה", "לינץ"], a: 2 }
        ];

        function renderGames() {
            const content = document.getElementById('app-content');
            const scores = appData.games.triviaScores || { mishmar: 0, adora: 0 };
            
            content.innerHTML = `
                <div class="text-center mb-6 mt-4">
                    <h2 class="text-3xl font-extrabold text-gray-800"><i class="fas fa-gamepad text-orange-500 mr-2"></i> משחקי הדרך</h2>
                    <p class="text-gray-500 mt-2">טריוויה לייב: מי המשפחה שתנצח?</p>
                </div>

                <div class="bg-gradient-to-r from-orange-500 to-red-500 rounded-2xl shadow-lg p-1 mb-8">
                    <div class="bg-white rounded-xl p-5 flex justify-between items-center text-center">
                        <div class="flex-1">
                            <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">פרידמן - משמר</p>
                            <p class="text-4xl font-black text-indigo-600">${scores.mishmar || 0}</p>
                        </div>
                        <div class="px-4 text-3xl font-black text-gray-200">VS</div>
                        <div class="flex-1">
                            <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">פרידמן - אדורה</p>
                            <p class="text-4xl font-black text-blue-600">${scores.adora || 0}</p>
                        </div>
                    </div>
                </div>

                <div class="bg-orange-50 border border-orange-200 rounded-2xl p-6 text-center">
                    <h3 class="font-bold text-orange-800 text-xl mb-4">🏆 ליגת טריוויה קרוואנים!</h3>
                    <p class="text-gray-600 mb-6 text-sm">שואלים שאלה בעל פה. מי שעונה נכון מקבל נקודה למשפחה שלו!</p>
                    <button onclick="startTriviaQuestion()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-8 rounded-full shadow-lg text-lg transition transform hover:scale-105 active:scale-95 w-full">
                        <i class="fas fa-play mr-2"></i> שלוף שאלה!
                    </button>
                    <div id="trivia-area" class="mt-6 hidden"></div>
                </div>
            `;
        }

        function startTriviaQuestion() {
            const currentQuestionIndex = Math.floor(Math.random() * triviaQuestions.length);
            const qObj = triviaQuestions[currentQuestionIndex];
            const area = document.getElementById('trivia-area');
            area.classList.remove('hidden');
            
            let optionsHtml = qObj.options.map((opt, idx) => 
                `<button onclick="answerTrivia(${idx}, ${qObj.a})" class="w-full text-right p-3 bg-white border border-orange-200 rounded-lg shadow-sm hover:bg-orange-100 font-medium transition text-gray-700">${opt}</button>`
            ).join('');

            area.innerHTML = `
                <div class="bg-white p-5 rounded-xl shadow border border-gray-100 text-right">
                    <p class="text-lg font-bold text-gray-800 mb-4">${qObj.q}</p>
                    <div class="flex flex-col gap-2">${optionsHtml}</div>
                </div>
            `;
        }

        function answerTrivia(selectedIdx, correctIdx) {
            if(selectedIdx === correctIdx) {
                document.getElementById('trivia-area').innerHTML = `
                    <div class="bg-green-100 p-5 rounded-xl border border-green-200 text-center animate-pulse">
                        <p class="text-xl font-bold text-green-700 mb-4">🎉 תשובה נכונה! 🎉</p>
                        <p class="text-sm font-bold text-gray-600 mb-3">לאיזו משפחה להוסיף את הנקודה?</p>
                        <div class="flex gap-3 justify-center">
                            <button onclick="addScore('mishmar')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold">משמר</button>
                            <button onclick="addScore('adora')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">אדורה</button>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('trivia-area').innerHTML = `
                    <div class="bg-red-50 p-5 rounded-xl border border-red-200 text-center">
                        <p class="text-lg font-bold text-red-600 mb-2">אופס... טעות! 😢</p>
                        <button onclick="startTriviaQuestion()" class="text-gray-500 underline text-sm mt-2">נסו שאלה אחרת</button>
                    </div>
                `;
            }
        }

        function addScore(family) {
            const currentScore = appData.games.triviaScores[family] || 0;
            db.ref(`games/triviaScores/${family}`).set(currentScore + 1);
            document.getElementById('trivia-area').classList.add('hidden');
        }

        function renderMap() {
            const content = document.getElementById('app-content');
            const locations = appData.locations || {};
            
            let html = `
                <div class="text-center mb-6 mt-4">
                    <h2 class="text-3xl font-extrabold text-gray-800"><i class="fas fa-map-marked-alt text-red-500 mr-2"></i> מפת מסלול</h2>
                    <p class="text-gray-500 mt-2">ניווט מהיר ליעדים שלנו</p>
                </div>

                <div class="w-full bg-white rounded-2xl shadow-md overflow-hidden mb-8 border border-gray-200">
                    <iframe src="https://www.google.com/maps/d/embed?mid=1vXv68_zBwN2A0E4yv6S5Sg2c7kM&hl=en" width="100%" height="350" frameborder="0" style="border:0;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
                    <div class="bg-red-50 p-3 text-center text-sm text-red-700 border-t border-red-100">
                        <i class="fas fa-info-circle mr-1"></i> החליפו קישור זה למפה האישית שלכם ב-Google My Maps!
                    </div>
                </div>

        function handleAvatarUpload(event) {
            const file = event.target.files[0]; if (!file) return;
            showModal('מעלה...', '', false);
            const r = new FileReader();
            r.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if(w>h) { if(w>200) { h*=200/w; w=200; } } else { if(h>200) { w*=200/h; h=200; } }
                    canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
                    db.ref('avatars/' + currentTab).set(canvas.toDataURL('image/jpeg', 0.6)).then(()=>document.getElementById('custom-modal').classList.add('hidden'));
                }; img.src = e.target.result;
            }; r.readAsDataURL(file);
        }

        function openCustomDocUpload() {
            const docName = prompt("הכנס שם מסמך (למשל: ביטוח נסיעות, כרטיסי אטרקציות):");
            if(docName && docName.trim() !== "") {
                currentUploadDocType = docName.trim();
                isUploadingCustomDoc = true;
                document.getElementById('doc-upload-input').click();
            }
        }

        function openDocUpload(docType) {

            document.getElementById('doc-upload-input').click();
        }

        function handleDocumentUpload(event) {
            const file = event.target.files[0]; if (!file) return;
            showModal('שומר מסמך...', '', false);
            const r = new FileReader();
            r.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if(w>h) { if(w>1000) { h*=1000/w; w=1000; } } else { if(h>1000) { w*=1000/h; h=1000; } }
                    canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
                    db.ref(`documents/${currentTab}/${currentUploadDocType}`).set(canvas.toDataURL('image/jpeg', 0.7)).then(()=>document.getElementById('custom-modal').classList.add('hidden'));
                }; img.src = e.target.result;
            }; r.readAsDataURL(file); event.target.value=''; 
        }

        function renderContent() {
            const content = document.getElementById('app-content');
            const personItems = appData.items[currentTab] || {};
            const personDocs = appData.documents[currentTab] || {};
            
            let html = `
                <div class="flex justify-center mb-2 mt-4">

                const predefinedDocs = getRequiredDocsForTab(currentTab);

                // 1. מסמכי חובה מובנים

                    } else {
                        html += `

                        </div>`;
                    }
                });

                // 2. מסמכים מותאמים אישית שהמשתמש העלה
                Object.keys(personDocs).forEach(docKey => {
                    const isPredefined = predefinedDocs.some(d => d.id === docKey);
                    if(!isPredefined) {
                        html += `
                        <div onclick="viewDocument('${docKey}')" class="doc-card bg-slate-600/50 border border-slate-500 rounded-xl p-3 text-center cursor-pointer relative">

                            <p class="text-sm font-semibold truncate">${docKey}</p>

                    }
                });

                // 3. כפתור הוספת מסמך חדש
                html += `

                            <p class="text-xs font-bold">הוסף מסמך נוסף</p>
                        </div>
                    </div>
                </div>`;
            }

            const grouped = {};
            Object.keys(personItems).forEach(key => {
                const item = personItems[key];
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push({ id: key, ...item });
            });

            if (Object.keys(grouped).length === 0) {
                html += `<div class="text-center p-8 text-gray-500">אין פריטים להצגה.</div>`;
            } else {

                                <div><p class="font-bold ${item.packed ? 'packed-text' : ''}">${item.name}</p><p class="text-sm text-gray-500">כמות: ${item.amount} ${item.note ? `| ${item.note}`:''}</p></div>
                            </div>
                            <button onclick="db.ref('items/${currentTab}/${item.id}').remove()" class="text-red-400 p-2"><i class="fas fa-trash"></i></button>
                        </li>`;
                    });
                    html += `
                        <li class="p-4 bg-slate-50 rounded-b-2xl">
                            <div class="flex flex-col gap-2">
                                <input type="text" id="n-${category}" placeholder="שם פריט" class="p-3 border rounded-lg">
                                <div class="flex gap-2">
                                    <input type="text" id="a-${category}" placeholder="כמות" class="w-1/3 p-3 border rounded-lg">
                                    <button onclick="db.ref('items/${currentTab}').push({category:'${category}', name:document.getElementById('n-${category}').value.trim(), amount:document.getElementById('a-${category}').value.trim()||'1', packed:false})" class="w-2/3 bg-indigo-600 text-white rounded-lg font-bold">הוסף</button>
                                </div>
                            </div>
                        </li></ul></div>`;
                }
            }
            content.innerHTML = html;
        }

        function updateTotalProgress() {
            let total = 0, packed = 0;
            allPeople.forEach(p => {
                if(appData.items[p]) { Object.values(appData.items[p]).forEach(i => { total++; if(i.packed) packed++; }); }
            });
            const percent = total === 0 ? 0 : Math.round((packed / total) * 100);
            document.getElementById('total-progress-bar').style.width = `${percent}%`;
            document.getElementById('total-progress-text').innerText = `אריזה כללית: ${percent}%`;
        }

        function exportToExcel() {
            let csvContent = "\uFEFFעבור,קטגוריה,פריט,כמות,הערות,נארז?\n";
            allPeople.forEach(person => {
                if(appData.items[person]) {
                    Object.values(appData.items[person]).forEach(item => {
                        csvContent += `"${person}","${(item.category||"").replace(/"/g,'""')}","${(item.name||"").replace(/"/g,'""')}","${(item.amount||"").replace(/"/g,'""')}","${(item.note||"").replace(/"/g,'""')}","${item.packed?"כן":"לא"}"\n`;
                    });
                }
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
            link.download = "רשימת_אריזה_קרוואנים.csv"; link.click();
        }

        function generateInitialData() {
            // Setup defaults if missing
            if (!appData.chores || Object.keys(appData.chores).length === 0) {
                db.ref('chores').set([{ name: "שטיפת כלים", assignee: "" }, { name: "ריקון שירותים (קרוואן 1)", assignee: "" }]);
            }
            if (!appData.checklists || Object.keys(appData.checklists.departure || {}).length === 0) {
                db.ref('checklists/departure').set([{ task: "ניתוק חשמל ומים", done: false }, { task: "ריקון קסטה אפורה/שחורה", done: false }, { task: "סגירת גז וחלונות", done: false }]);
                db.ref('checklists/arrival').set([{ task: "ייצוב קרוואן וחשמל", done: false }, { task: "פתיחת גז לבישול", done: false }]);
            }

            allPeople.forEach(person => {
                if (!appData.items[person] || Object.keys(appData.items[person]).length === 0) {
                    let itemsArray = [];
                    if (!person.startsWith("ציוד כללי")) {
                        itemsArray = [
                            { category: "ביגוד יומיום", name: "חולצות קצרות", amount: "8" },
                            { category: "ביגוד יומיום", name: "מכנסיים קצרים", amount: "5" },
                            { category: "ביגוד חורף", name: "מעיל פליז / סופטשל", amount: "1", note: "לאוסטריה" },
                            { category: "היגיינה ורחצה", name: "תיק רחצה אישי", amount: "1" }
                        ];
                        if (["עוזיאל", "דביר", "אליה", "יוני", "ליאור", "אייל"].includes(person)) {
                            itemsArray.push({ category: "דת ורוח", name: "תפילין וכיפות", amount: "1" });
                        }
                    } else {
                        itemsArray = [ { category: "לינה וקרוואן", name: "סדינים ושמיכות", amount: "6 סטים" }, { category: "שבת וכשרות", name: "פלטת שבת ומיחם", amount: "1" } ];
                    }

                    if(itemsArray.length > 0) {
                        const obj = {}; itemsArray.forEach((item, i) => obj[`item_${Date.now()}_${i}`] = { ...item, packed: false });
                        db.ref(`items/${person}`).set(obj);
                    }
                }
            });
        }
    </script>
</body>
</html>
